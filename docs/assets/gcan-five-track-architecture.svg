<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="t d"><title id="t">GCAN Five Track Architecture</title><desc id="d">Five workstreams connected through governance and a shared learning loop.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09172e"/><stop offset="1" stop-color="#20345b"/></linearGradient></defs><rect width="1500" height="850" rx="28" fill="url(#bg)"/><text x="750" y="75" fill="white" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle">GCAN · FIVE CONNECTED WORKSTREAMS</text><text x="750" y="112" fill="#afc2df" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Independent workbenches · Shared evidence · Reviewed integration</text><g font-family="Arial,'Noto Sans TC',sans-serif" text-anchor="middle"><g><rect x="55" y="190" width="250" height="205" rx="18" fill="#18365f" stroke="#77a5ff" stroke-width="2"/><text x="180" y="240" fill="#b8d1ff" font-size="18">A · FACTORY</text><text x="180" y="285" fill="white" font-size="25" font-weight="700">Agent Factory</text><text x="180" y="330" fill="#c7d6eb" font-size="16">Plan · Build · Test</text><text x="180" y="358" fill="#c7d6eb" font-size="16">Repair · Deliver</text></g><g><rect x="345" y="190" width="250" height="205" rx="18" fill="#16404b" stroke="#64d2c5" stroke-width="2"/><text x="470" y="240" fill="#a4f0e5" font-size="18">B · PRODUCT</text><text x="470" y="285" fill="white" font-size="25" font-weight="700">GCAN Platform</text><text x="470" y="330" fill="#c7e5e2" font-size="16">Users · Workflows</text><text x="470" y="358" fill="#c7e5e2" font-size="16">Feedback · Outcomes</text></g><g><rect x="635" y="190" width="250" height="205" rx="18" fill="#3a315e" stroke="#aa96ff" stroke-width="2"/><text x="760" y="240" fill="#d0c4ff" font-size="18">C · PREDICT</text><text x="760" y="285" fill="white" font-size="24" font-weight="700">Predictive Coding</text><text x="760" y="330" fill="#ddd6f5" font-size="16">Forecast · Observe</text><text x="760" y="358" fill="#ddd6f5" font-size="16">Error · Calibrate</text></g><g><rect x="925" y="190" width="250" height="205" rx="18" fill="#49334e" stroke="#e4a0cf" stroke-width="2"/><text x="1050" y="240" fill="#f1c1e1" font-size="18">D · REASON</text><text x="1050" y="285" fill="white" font-size="25" font-weight="700">Deep Neural</text><text x="1050" y="330" fill="#ead3e3" font-size="16">Memory · Evidence</text><text x="1050" y="358" fill="#ead3e3" font-size="16">Reason · Evaluate</text></g><g><rect x="1215" y="190" width="230" height="205" rx="18" fill="#4a3d29" stroke="#e9c17a" stroke-width="2"/><text x="1330" y="240" fill="#f5dba7" font-size="18">E · RESEARCH</text><text x="1330" y="285" fill="white" font-size="24" font-weight="700">Deep Research</text><text x="1330" y="330" fill="#eee0c5" font-size="16">Sources · Counter</text><text x="1330" y="358" fill="#eee0c5" font-size="16">Verify · Report</text></g></g><g fill="none" stroke="#8bb1ff" stroke-width="4"><path d="M180 395V465H1330V395M470 395V465M760 395V465M1050 395V465M750 465V535"/></g><rect x="250" y="535" width="1000" height="180" rx="22" fill="#111f39" stroke="#7898d0" stroke-width="2"/><text x="750" y="590" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle">SHARED GOVERNANCE &amp; LEARNING LOOP</text><g fill="#c8d8ef" font-family="Arial,'Noto Sans TC',sans-serif" font-size="19" text-anchor="middle"><text x="750" y="640">Observe → Predict → Act → Measure → Explain → Learn</text><text x="750" y="680">Review → Test → Version → Publish → Monitor</text></g><text x="750" y="785" fill="#a8bddc" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Cross-track changes require provenance, owner review, compatibility tests and rollback.</text></svg>