<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">GCAN A–O Fifteen Workstreams and P Governance Architecture</title>
<desc id="desc">Fifteen independently owned workstreams A through O are coordinated under the cross-cutting P Governance, Ethics and Trust layer.</desc>
