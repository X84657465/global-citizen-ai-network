name: Verify GCAN Main Branch Protection Status

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gcan-pat.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gcan-pat.yml"

permissions:
  contents: read
  administration: read

jobs:
  verify-main-branch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Read main branch protection status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          Write-Output "::add-mask::$env:GH_TOKEN"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $uri = "https://api.github.com/repos/$env:REPOSITORY/branches/main"
          try {
            $branch = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
            Write-Output "Branch: $($branch.name)"
            Write-Output "Protected: $($branch.protected)"
            Write-Output "Protection enabled: $($branch.protection.enabled)"
            if ($branch.protected -eq $false) {
              Write-Output "STATUS: main currently has no branch protection rules."
            } else {
              Write-Output "STATUS: main is protected; detailed rule inspection requires administration permission."
            }
          } catch {
            $status = $null
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $status = [int]$_.Exception.Response.StatusCode }
            Write-Output "HTTP status: $status"
            Write-Error "Could not read main branch status; credential details suppressed."
            exit 1
          }