name: Verify GCAN Branch Protection Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gcan-pat.yml"

permissions:
  contents: read
  administration: read

jobs:
  verify-branch-protection:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Test branch protection read permission
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          Write-Output "::add-mask::$env:GH_TOKEN"
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:REPOSITORY/branches/main/protection"
          try {
            $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get
            Write-Output "HTTP status: $([int]$response.StatusCode)"
            if ([int]$response.StatusCode -ne 200) { throw "Unexpected HTTP status." }
            $policy = $response.Content | ConvertFrom-Json
            Write-Output "PASS: GITHUB_TOKEN can read main branch protection."
            Write-Output "Required status checks configured: $($null -ne $policy.required_status_checks)"
          }
          catch {
            $statusCode = $null
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) { $statusCode = [int]$_.Exception.Response.StatusCode }
            Write-Output "HTTP status: $statusCode"
            Write-Error "Branch protection read failed. No credential value was logged."
            exit 1
          }
