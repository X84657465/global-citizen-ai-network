name: Verify GCAN PAT Branch Protection Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gcan-pat.yml"

permissions:
  contents: read

jobs:
  verify-branch-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify secret is available without revealing it
        shell: bash
        env:
          GCAN_PAT: ${{ secrets.GCAN_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${GCAN_PAT}" ]]; then
            echo "::error::GCAN_PAT secret is missing or unavailable to this workflow."
            exit 1
          fi
          echo "::add-mask::${GCAN_PAT}"
          echo "GCAN_PAT secret is present."

      - name: Test branch protection read permission
        shell: bash
        env:
          GCAN_PAT: ${{ secrets.GCAN_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/branch-protection-response.json"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GCAN_PAT}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/branches/main/protection")"
          echo "HTTP status: ${status}"
          if [[ "${status}" == "200" ]]; then
            echo "PASS: PAT can read main branch protection."
            jq -r '"Required status checks configured: " + ((.required_status_checks != null) | tostring)' "${response_file}"
          else
            message="$(jq -r '.message // "No API error message returned"' "${response_file}" 2>/dev/null || echo "Unable to parse API response")"
            echo "::error::Branch protection read failed: ${message}"
            exit 1
          fi
