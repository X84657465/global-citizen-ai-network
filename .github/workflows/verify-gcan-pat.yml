name: Verify GCAN PAT Branch Protection Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-gcan-pat.yml"

permissions:
  contents: read

jobs:
  verify-branch-protection:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Verify secret is available without revealing it
        shell: pwsh
        env:
          GCAN_PAT: ${{ secrets.GCAN_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GCAN_PAT)) {
            Write-Error "GCAN_PAT secret is missing or unavailable to this workflow."
            exit 1
          }
          Write-Output "::add-mask::$env:GCAN_PAT"
          Write-Output "GCAN_PAT secret is present."

      - name: Test branch protection read permission
        shell: pwsh
        env:
          GCAN_PAT: ${{ secrets.GCAN_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GCAN_PAT"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $uri = "https://api.github.com/repos/$env:REPOSITORY/branches/main/protection"
          try {
            $response = Invoke-WebRequest -Uri $uri -Headers $headers -Method Get
            Write-Output "HTTP status: $([int]$response.StatusCode)"
            if ([int]$response.StatusCode -ne 200) {
              throw "Unexpected HTTP status."
            }
            $policy = $response.Content | ConvertFrom-Json
            Write-Output "PASS: PAT can read main branch protection."
            Write-Output "Required status checks configured: $($null -ne $policy.required_status_checks)"
          }
          catch {
            $statusCode = $null
            if ($_.Exception.Response -and $_.Exception.Response.StatusCode) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            Write-Output "HTTP status: $statusCode"
            Write-Error "Branch protection read failed. See GitHub API response status; the token value is never logged."
            exit 1
          }
