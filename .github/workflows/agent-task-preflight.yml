name: AI Agent Task Preflight

on:
  push:
    branches:
      - codex/ai-runner-foundation
    paths:
      - "lib/agent-task-validation.mjs"
      - "lib/agent-patch-validation.mjs"
      - "lib/agent-plan-validation.mjs"
      - "scripts/prepare-agent-task.mjs"
      - "tests/agent-task-validation.test.mjs"
      - "tests/agent-patch-validation.test.mjs"
      - "tests/agent-plan-validation.test.mjs"
      - "package.json"
      - ".github/workflows/agent-task-preflight.yml"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Repository issue number containing the approved AI task"
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-agent-task-preflight
  cancel-in-progress: false

jobs:
  validation-tests:
    name: Windows self-hosted project validation
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node --version
          npm --version

      - name: Audit available local isolation capabilities
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            Write-Host "OS: $($os.Caption) | Version: $($os.Version) | Build: $($os.BuildNumber)"
          } catch {
            Write-Host "OS metadata query unavailable: $($_.Exception.Message)"
          }

          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if ($wsl) {
            Write-Host "WSL: installed"
            wsl.exe --status
            if ($LASTEXITCODE -ne 0) { Write-Host "WSL status query returned $LASTEXITCODE" }
          } else {
            Write-Host "WSL: not found"
          }

          $ollama = Get-Command ollama.exe -ErrorAction SilentlyContinue
          if ($ollama) {
            Write-Host "Ollama CLI: installed"
            ollama.exe --version
          } else {
            Write-Host "Ollama CLI: not found on PATH"
          }

          try {
            $ollamaTags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 -ErrorAction Stop
            $modelNames = @($ollamaTags.models | ForEach-Object { $_.name })
            if ($modelNames.Count -gt 0) {
              Write-Host "Local Ollama API: available"
              Write-Host "Local models: $($modelNames -join ', ')"
            } else {
              Write-Host "Local Ollama API: available; no models listed"
            }
          } catch {
            Write-Host "Local Ollama API: not responding on 127.0.0.1:11434"
          }

          $docker = Get-Command docker.exe -ErrorAction SilentlyContinue
          if ($docker) {
            Write-Host "Docker CLI: installed"
            docker.exe --version
            docker.exe info --format "Server={{.ServerVersion}} OS={{.OperatingSystem}}"
            if ($LASTEXITCODE -ne 0) { Write-Host "Docker daemon is unavailable (exit $LASTEXITCODE)" }
          } else {
            Write-Host "Docker CLI: not found"
          }

          try {
            $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            Write-Host "HypervisorPresent: $($computer.HypervisorPresent)"
          } catch {
            Write-Host "Hypervisor status query unavailable"
          }

          $featureCmd = Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue
          if ($featureCmd) {
            try {
              $sandbox = Get-WindowsOptionalFeature -Online -FeatureName Containers-DisposableClientVM -ErrorAction Stop
              Write-Host "Windows Sandbox feature: $($sandbox.State)"
            } catch {
              Write-Host "Windows Sandbox feature query unavailable (possibly requires elevation): $($_.Exception.Message)"
            }
          } else {
            Write-Host "Windows feature query cmdlet: not available"
          }

      - name: Probe the smallest installed local Ollama model
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          try {
            $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 -ErrorAction Stop
            $models = @($tags.models | Sort-Object size)
            if ($models.Count -eq 0) {
              Write-Host "No local Ollama model is installed; skipping inference probe."
              exit 0
            }

            foreach ($model in $models) {
              $sizeGb = [math]::Round(($model.size / 1GB), 2)
              Write-Host "Installed model: $($model.name) | Size: $sizeGb GiB"
            }

            $selected = $models[0]
            Write-Host "Probing smallest installed model: $($selected.name)"

            $showBody = @{ name = $selected.name; verbose = $false } | ConvertTo-Json -Compress
            $show = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:11434/api/show" -Body $showBody -ContentType "application/json" -TimeoutSec 20
            if ($show.details) {
              Write-Host "Model family: $($show.details.family)"
              Write-Host "Parameter size: $($show.details.parameter_size)"
              Write-Host "Quantization: $($show.details.quantization_level)"
            }

            $requestBody = @{
              model = $selected.name
              prompt = "Reply with READY only."
              stream = $false
              keep_alive = "0s"
              options = @{ num_predict = 8; temperature = 0 }
            } | ConvertTo-Json -Depth 5 -Compress

            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            $result = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:11434/api/generate" -Body $requestBody -ContentType "application/json" -TimeoutSec 180
            $timer.Stop()

            if (-not $result.response) { throw "Local model returned an empty response." }
            $tokensPerSecond = 0
            if ($result.eval_duration -gt 0) {
              $tokensPerSecond = [math]::Round(($result.eval_count / ($result.eval_duration / 1000000000)), 2)
            }
            Write-Host "Local inference: success"
            Write-Host "Elapsed seconds: $([math]::Round($timer.Elapsed.TotalSeconds, 2))"
            Write-Host "Generated tokens: $($result.eval_count)"
            Write-Host "Approx. generation speed: $tokensPerSecond tokens/second"
            Write-Host "Response preview: $($result.response.Substring(0, [math]::Min(100, $result.response.Length)))"
          } catch {
            Write-Host "Local Ollama inference probe failed: $($_.Exception.Message)"
            Write-Host "This does not affect the read-only validation workflow."
          }

      - name: Verify disposable container isolation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          docker pull $imageDigest
          if ($LASTEXITCODE -ne 0) { throw "Unable to pull the pinned sandbox test image" }
          Write-Host "Sandbox test image: $imageDigest"

          $outputDir = Join-Path $env:RUNNER_TEMP "agent-sandbox-output"
          if (Test-Path $outputDir) { Remove-Item $outputDir -Recurse -Force }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $inputMount = "type=bind,source=$env:GITHUB_WORKSPACE,target=/input,readonly"
          $outputMount = "type=bind,source=$outputDir,target=/output"

          $sandboxCode = @'
          const fs = require("node:fs");
          const net = require("node:net");

          if (typeof process.getuid === "function" && process.getuid() !== 1000) {
            console.error("Container did not run as the unprivileged node UID");
            process.exit(13);
          }

          try {
            fs.writeFileSync("/etc/agent-sandbox-write-test", "unexpected");
            console.error("Root filesystem is writable");
            process.exit(11);
          } catch (error) {
            if (!["EROFS", "EACCES"].includes(error.code)) throw error;
            console.log("PASS: root filesystem is read-only");
          }

          fs.writeFileSync("/tmp/agent-sandbox-write-test", "temporary");
          fs.unlinkSync("/tmp/agent-sandbox-write-test");
          console.log("PASS: bounded temporary filesystem is writable");

          try {
            fs.writeFileSync("/input/.agent-sandbox-readonly-probe", "unexpected");
            console.error("Repository input mount is writable");
            process.exit(14);
          } catch (error) {
            if (!["EROFS", "EACCES", "EPERM"].includes(error.code)) throw error;
            console.log("PASS: repository input mount is read-only");
          }

          fs.writeFileSync("/output/agent-sandbox-output-probe.txt", "sandbox-output-only");
          console.log("PASS: dedicated output mount is writable");

          const socket = net.createConnection({ host: "1.1.1.1", port: 443 });
          let finished = false;
          const finish = (ok, message) => {
            if (finished) return;
            finished = true;
            socket.destroy();
            console.log(message);
            process.exit(ok ? 0 : 12);
          };
          socket.setTimeout(1500);
          socket.on("connect", () => finish(false, "FAIL: network unexpectedly reachable"));
          socket.on("error", () => finish(true, "PASS: outbound network is blocked"));
          socket.on("timeout", () => finish(true, "PASS: outbound network is blocked"));
          setTimeout(() => finish(true, "PASS: outbound network is blocked"), 2000);
          '@

          $encodedSandboxCode = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($sandboxCode))
          docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 --mount $inputMount --mount $outputMount $imageDigest node -e "eval(Buffer.from('$encodedSandboxCode','base64').toString())"
          if ($LASTEXITCODE -ne 0) { throw "Disposable container isolation test failed" }

          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE ".agent-sandbox-readonly-probe")) {
            throw "Sandbox unexpectedly modified the repository input"
          }
          $outputProbe = Join-Path $outputDir "agent-sandbox-output-probe.txt"
          if (-not (Test-Path $outputProbe) -or (Get-Content $outputProbe -Raw) -ne "sandbox-output-only") {
            throw "Sandbox output did not remain inside the dedicated output directory"
          }
          Remove-Item $outputDir -Recurse -Force
          Write-Host "PASS: host repository remained unchanged; output stayed in isolated scratch directory"

      - name: Install locked dependencies without lifecycle scripts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete unit test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run test:unit

      - name: Run TypeScript validation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npx --no-install tsc --noEmit

      - name: Run ESLint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run lint

  prepare-task:
    name: Validate and package one task (no AI execution)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate task and create a safe handoff bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/prepare-agent-task.mjs

      - name: Generate and validate a read-only plan with local Ollama
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/generate-agent-plan.mjs

      - name: Upload validated task and plan
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-task-${{ inputs.issue_number }}
          path: |
            artifacts/agent-task.json
            artifacts/agent-plan.json
          if-no-files-found: error
          retention-days: 3
