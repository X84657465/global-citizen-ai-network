name: AI Agent Task Preflight

on:
  push:
    branches:
      - main
      - codex/ai-runner-foundation
      - feat/agent-factory-v2
    paths:
      - "lib/agent-task-validation.mjs"
      - "lib/agent-patch-validation.mjs"
      - "lib/agent-plan-validation.mjs"
      - "scripts/prepare-agent-task.mjs"
      - "scripts/select-agent-task.mjs"
      - "scripts/agent-factory-controller.mjs"
      - "scripts/agent-factory-v2-controller.mjs"
      - "lib/agent-factory-controller.mjs"
      - "lib/agent-failure-scope.mjs"
      - "tests/agent-failure-scope.test.mjs"
      - "lib/agent-factory-state-machine.mjs"
      - "lib/agent-factory-state-store.mjs"
      - "lib/agent-task-queue.mjs"
      - "lib/github-api-client.mjs"
      - "lib/github-pagination.mjs"
      - "lib/agent-path-safety.mjs"
      - "lib/agent-scratch-evidence.mjs"
      - "lib/agent-publisher-branch.mjs"
      - "lib/agent-task-pr-metadata.mjs"
      - "scripts/resolve-agent-task-pr.mjs"
      - "lib/agent-factory-policy.mjs"
      - "tests/agent-factory-policy.test.mjs"
      - "tests/agent-task-queue.test.mjs"
      - "tests/github-api-client.test.mjs"
      - "tests/github-pagination.test.mjs"
      - "eslint.config.mjs"
      - "scripts/generate-agent-plan.mjs"
      - "scripts/generate-agent-patch.mjs"
      - "scripts/apply-agent-patch-to-scratch.mjs"
      - "scripts/publish-agent-patch.mjs"
      - "tests/agent-task-validation.test.mjs"
      - "tests/agent-patch-validation.test.mjs"
      - "tests/agent-plan-validation.test.mjs"
      - "tests/agent-factory-controller.test.mjs"
      - "tests/agent-factory-lifecycle.integration.test.mjs"
      - "tests/agent-factory-state-machine.test.mjs"
      - "tests/agent-factory-state-store.test.mjs"
      - "tests/agent-path-safety.test.mjs"
      - "tests/agent-scratch-evidence.test.mjs"
      - "tests/agent-publisher-branch.test.mjs"
      - "tests/agent-task-pr-metadata.test.mjs"
      - "tests/ci-trigger-policy.test.mjs"
      - "package.json"
      - ".github/workflows/agent-task-preflight.yml"
      - ".github/workflows/ci.yml"
  issues:
    types: [opened, reopened]
  repository_dispatch:
    types: [ai-task-next]
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Repository issue number containing the approved AI task"
        required: true
        type: string

permissions:
  contents: read
  issues: read

# Durable task Issues and state are the source of truth. Coalesce only scheduled pollers;
# actionable task triggers must keep independent workflow runs. Serialize Runner jobs below.
concurrency:
  group: global-citizen-ai-network-preflight-${{ github.event_name == 'schedule' && 'poller' || github.run_id }}
  cancel-in-progress: false

jobs:
  validation-tests:
    name: Windows self-hosted project validation
    if: github.event_name == 'push' && github.actor == github.repository_owner
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Verify toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node --version
          npm --version
          node --check scripts/select-agent-task.mjs
          if ($LASTEXITCODE -ne 0) { throw "Scheduled task selector syntax check failed." }
          node --check scripts/agent-factory-controller.mjs
          if ($LASTEXITCODE -ne 0) { throw "Legacy factory controller syntax check failed." }
          node --check scripts/agent-factory-v2-controller.mjs
          if ($LASTEXITCODE -ne 0) { throw "V2 factory controller syntax check failed." }
          node --check scripts/resolve-agent-task-pr.mjs
          if ($LASTEXITCODE -ne 0) { throw "Candidate PR resolver syntax check failed." }
          node --check lib/agent-factory-controller.mjs
          if ($LASTEXITCODE -ne 0) { throw "V2 factory controller module syntax check failed." }
          node --check lib/agent-factory-state-machine.mjs
          if ($LASTEXITCODE -ne 0) { throw "Factory state machine syntax check failed." }
          node --check lib/agent-factory-state-store.mjs
          if ($LASTEXITCODE -ne 0) { throw "Factory state store syntax check failed." }
          node --check scripts/publish-agent-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw "Publisher syntax check failed." }
          node --check lib/agent-factory-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw "Factory policy syntax check failed." }

      - name: Audit available local isolation capabilities
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            Write-Host "OS: $($os.Caption) | Version: $($os.Version) | Build: $($os.BuildNumber)"
          } catch {
            Write-Host "OS metadata query unavailable: $($_.Exception.Message)"
          }

          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if ($wsl) {
            Write-Host "WSL: installed"
            wsl.exe --status
            if ($LASTEXITCODE -ne 0) { Write-Host "WSL status query returned $LASTEXITCODE" }
          } else {
            Write-Host "WSL: not found"
          }

          $ollama = Get-Command ollama.exe -ErrorAction SilentlyContinue
          if ($ollama) {
            Write-Host "Ollama CLI: installed"
            ollama.exe --version
          } else {
            Write-Host "Ollama CLI: not found on PATH"
          }

          try {
            $ollamaTags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 3 -ErrorAction Stop
            $modelNames = @($ollamaTags.models | ForEach-Object { $_.name })
            if ($modelNames.Count -gt 0) {
              Write-Host "Local Ollama API: available"
              Write-Host "Local models: $($modelNames -join ', ')"
            } else {
              Write-Host "Local Ollama API: available; no models listed"
            }
          } catch {
            Write-Host "Local Ollama API: not responding on 127.0.0.1:11434"
          }

          $docker = Get-Command docker.exe -ErrorAction SilentlyContinue
          if ($docker) {
            Write-Host "Docker CLI: installed"
            docker.exe --version

            # This step is diagnostic only. Capture the native process exit code
            # without allowing PowerShell's native-command error handling to abort
            # the entire preflight before the dedicated isolation gate can report
            # the actionable failure.
            $dockerStdout = Join-Path $env:RUNNER_TEMP "docker-info.stdout.txt"
            $dockerStderr = Join-Path $env:RUNNER_TEMP "docker-info.stderr.txt"
            try {
              $dockerInfo = Start-Process -FilePath $docker.Source -ArgumentList @(
                "info",
                "--format",
                "Server={{.ServerVersion}};OS={{.OperatingSystem}}"
              ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $dockerStdout -RedirectStandardError $dockerStderr
              if ($dockerInfo.ExitCode -eq 0) {
                Get-Content -LiteralPath $dockerStdout | ForEach-Object { Write-Host $_ }
              } else {
                $dockerError = if (Test-Path $dockerStderr) { (Get-Content -LiteralPath $dockerStderr -Raw).Trim() } else { "" }
                Write-Host "Docker daemon is unavailable (exit $($dockerInfo.ExitCode)). The disposable-container isolation gate remains mandatory."
                if ($dockerError) { Write-Host $dockerError }
              }
            } catch {
              Write-Host "Docker daemon diagnostic unavailable: $($_.Exception.Message). The disposable-container isolation gate remains mandatory."
            } finally {
              Remove-Item -LiteralPath $dockerStdout,$dockerStderr -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "Docker CLI: not found; the disposable-container isolation gate remains mandatory."
          }

          try {
            $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            Write-Host "HypervisorPresent: $($computer.HypervisorPresent)"
          } catch {
            Write-Host "Hypervisor status query unavailable"
          }

          $featureCmd = Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue
          if ($featureCmd) {
            try {
              $sandbox = Get-WindowsOptionalFeature -Online -FeatureName Containers-DisposableClientVM -ErrorAction Stop
              Write-Host "Windows Sandbox feature: $($sandbox.State)"
            } catch {
              Write-Host "Windows Sandbox feature query unavailable (possibly requires elevation): $($_.Exception.Message)"
            }
          } else {
            Write-Host "Windows feature query cmdlet: not available"
          }

      - name: Smoke-test local Ollama plan generation with a synthetic task
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          $task = @{
            schema_version = 1
            mode = "preflight_only"
            ai_execution_enabled = $false
            repository = $env:GITHUB_REPOSITORY
            issue = @{
              number = 999999
              title = "[AI Task] Synthetic publication dry run"
              author = ($env:GITHUB_REPOSITORY.Split('/')[0])
              url = "https://github.com/$($env:GITHUB_REPOSITORY)/issues/999999"
            }
            safety = @{
              issue_content_is_untrusted_data = $true
              repository_code_was_not_executed = $true
              files_were_not_modified = $true
              pull_request_was_not_created = $true
              production_database_or_deployment_touched = $false
            }
            goal = "Prepare a minimal new documentation page describing the safe local AI task pipeline and its approval boundaries."
            allowed_paths = @("docs/agent-pipeline-smoke-test.md")
            acceptance_criteria = @(
              "The plan is valid JSON and passes the agent plan validator.",
              "The documentation patch is bounded to the one approved path."
            )
            explicit_exclusions = @(
              "Do not apply the proposed patch to repository files.",
              "Do not execute commands or deploy."
            )
          }
          $json = $task | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "artifacts/agent-task.json"),
            $json,
            [System.Text.UTF8Encoding]::new($false)
          )
          node scripts/generate-agent-plan.mjs
          if ($LASTEXITCODE -ne 0) { throw "Local Ollama plan generation smoke test failed." }

          $plan = Get-Content "artifacts/agent-plan.json" -Raw | ConvertFrom-Json
          if ($plan.ai_execution_enabled -ne $false) { throw "Plan must keep AI code execution disabled." }
          if ($plan.tasks.Count -lt 1 -or $plan.tasks.Count -gt 12) { throw "Plan task count is outside the allowed range." }
          $implementerTasks = @($plan.tasks | Where-Object { $_.role -eq "implementer" -and $_.action -eq "propose_patch" })
          if ($implementerTasks.Count -ne 1) { throw "Plan must contain exactly one bounded implementer patch task." }
          foreach ($planTask in $plan.tasks) {
            foreach ($approvedPath in $planTask.allowed_paths) {
              if ($approvedPath -ne "docs/agent-pipeline-smoke-test.md") {
                throw "Plan contains a path outside the synthetic task allowlist."
              }
            }
          }
          Write-Host "PASS: local model generated a validated read-only plan."

      - name: Smoke-test local Ollama patch proposal
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/generate-agent-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw "Local Ollama patch proposal smoke test failed." }
          if (-not (Test-Path "artifacts/agent-patch.json")) {
            throw "The synthetic task did not produce a validated patch proposal."
          }
          $patch = Get-Content "artifacts/agent-patch.json" -Raw | ConvertFrom-Json
          if ($patch.files.Count -lt 1 -or $patch.files.Count -gt 20) {
            throw "Patch proposal file count is outside the allowed range."
          }
          foreach ($file in $patch.files) {
            if ($file.path -ne "docs/agent-pipeline-smoke-test.md") {
              throw "Patch proposal contains a path outside the synthetic task allowlist."
            }
          }
          Write-Host "PASS: local model generated a validated patch manifest without applying it."

      - name: Preserve synthetic AI artifacts for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-synthetic-${{ github.run_id }}
          path: |
            artifacts/agent-task.json
            artifacts/agent-plan.json
            artifacts/agent-patch.json
          if-no-files-found: warn
          retention-days: 1

      - name: Verify disposable container isolation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          docker pull $imageDigest
          if ($LASTEXITCODE -ne 0) { throw "Unable to pull the pinned sandbox test image" }
          Write-Host "Sandbox test image: $imageDigest"

          $outputDir = Join-Path $env:RUNNER_TEMP "agent-sandbox-output"
          if (Test-Path $outputDir) { Remove-Item $outputDir -Recurse -Force }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $inputMount = "type=bind,source=$env:GITHUB_WORKSPACE,target=/input,readonly"
          $outputMount = "type=bind,source=$outputDir,target=/output"

          $sandboxCode = @'
          const fs = require("node:fs");
          const net = require("node:net");

          if (typeof process.getuid === "function" && process.getuid() !== 1000) {
            console.error("Container did not run as the unprivileged node UID");
            process.exit(13);
          }

          try {
            fs.writeFileSync("/etc/agent-sandbox-write-test", "unexpected");
            console.error("Root filesystem is writable");
            process.exit(11);
          } catch (error) {
            if (!["EROFS", "EACCES"].includes(error.code)) throw error;
            console.log("PASS: root filesystem is read-only");
          }

          fs.writeFileSync("/tmp/agent-sandbox-write-test", "temporary");
          fs.unlinkSync("/tmp/agent-sandbox-write-test");
          console.log("PASS: bounded temporary filesystem is writable");

          try {
            fs.writeFileSync("/input/.agent-sandbox-readonly-probe", "unexpected");
            console.error("Repository input mount is writable");
            process.exit(14);
          } catch (error) {
            if (!["EROFS", "EACCES", "EPERM"].includes(error.code)) throw error;
            console.log("PASS: repository input mount is read-only");
          }

          fs.writeFileSync("/output/agent-sandbox-output-probe.txt", "sandbox-output-only");
          console.log("PASS: dedicated output mount is writable");

          const socket = net.createConnection({ host: "1.1.1.1", port: 443 });
          let finished = false;
          const finish = (ok, message) => {
            if (finished) return;
            finished = true;
            socket.destroy();
            console.log(message);
            process.exit(ok ? 0 : 12);
          };
          socket.setTimeout(1500);
          socket.on("connect", () => finish(false, "FAIL: network unexpectedly reachable"));
          socket.on("error", () => finish(true, "PASS: outbound network is blocked"));
          socket.on("timeout", () => finish(true, "PASS: outbound network is blocked"));
          setTimeout(() => finish(true, "PASS: outbound network is blocked"), 2000);
          '@

          $encodedSandboxCode = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($sandboxCode))
          docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 256m --cpus 1 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000 --mount $inputMount --mount $outputMount $imageDigest node -e "eval(Buffer.from('$encodedSandboxCode','base64').toString())"
          if ($LASTEXITCODE -ne 0) { throw "Disposable container isolation test failed" }

          if (Test-Path (Join-Path $env:GITHUB_WORKSPACE ".agent-sandbox-readonly-probe")) {
            throw "Sandbox unexpectedly modified the repository input"
          }
          $outputProbe = Join-Path $outputDir "agent-sandbox-output-probe.txt"
          if (-not (Test-Path $outputProbe) -or (Get-Content $outputProbe -Raw) -ne "sandbox-output-only") {
            throw "Sandbox output did not remain inside the dedicated output directory"
          }
          Remove-Item $outputDir -Recurse -Force
          Write-Host "PASS: host repository remained unchanged; output stayed in isolated scratch directory"

      - name: Transition task to sandbox testing
        if: steps.reserve-task.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          NEXT_TASK_STATE: sandbox_testing
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Apply validated patch to a disposable scratch workspace
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/apply-agent-patch-to-scratch.mjs

      - name: Install candidate dependencies inside restricted container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          $scratch = [string]$manifest.scratch_dir
          if (-not (Test-Path $scratch -PathType Container)) { throw "Disposable scratch workspace is missing." }
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          $workspaceMount = "type=bind,source=$scratch,target=/workspace"
          docker run --rm --pull never --network bridge --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000 --mount $workspaceMount --workdir /workspace --env HOME=/tmp/npm-home $imageDigest npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Candidate dependency installation failed inside the restricted container." }

      - name: Test patched candidate offline inside restricted container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          $scratch = [string]$manifest.scratch_dir
          if (-not (Test-Path $scratch -PathType Container)) { throw "Disposable scratch workspace is missing." }
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          $workspaceMount = "type=bind,source=$scratch,target=/workspace"
          $checks = "npm run test:unit && npx --no-install tsc --noEmit && npm run lint"
          $testLog = Join-Path $env:RUNNER_TEMP "agent-preflight-offline-test.log"
          $testOutput = & docker run --rm --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000 --mount $workspaceMount --workdir /workspace --env HOME=/tmp/test-home $imageDigest sh -lc $checks 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host "$_" }
          $testOutput | Out-File -LiteralPath $testLog -Encoding utf8
          if ($testExitCode -ne 0) { throw "Patched candidate failed isolated offline tests (exit $testExitCode). See the uploaded diagnostic artifact." }
          Write-Host "PASS: patched candidate tests ran offline in a restricted, non-root container."
      - name: Preserve synthetic offline test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preflight-synthetic-offline-test-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-preflight-offline-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate draft PR publisher without API writes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: "999999"
          CANDIDATE_TESTS_PASSED: "true"
          PUBLISH_AGENT_DRY_RUN: "true"
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/publish-agent-patch.mjs
          if ($LASTEXITCODE -ne 0) { throw "Draft PR publisher dry-run failed." }
          $result = Get-Content "artifacts/agent-publish.json" -Raw | ConvertFrom-Json
          if ($result.state -ne "dry_run" -or $result.no_api_writes -ne $true -or
              $result.automatic_merge -ne $false -or $result.production_deployment -ne $false) {
            throw "Draft PR publisher dry-run did not preserve safety boundaries."
          }

      - name: Preserve synthetic publication dry-run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-publish-dry-run-${{ github.run_id }}
          path: artifacts/agent-publish.json
          if-no-files-found: warn
          retention-days: 1

      - name: Install locked dependencies without lifecycle scripts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete unit test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run test:unit

      - name: Run TypeScript validation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npx --no-install tsc --noEmit

      - name: Run ESLint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run lint

      - name: Clean disposable scratch workspace
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifestPath = "artifacts/agent-scratch.json"
          if (Test-Path $manifestPath) {
            try {
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              $scratch = [string]$manifest.scratch_dir
              if ($scratch -and (Test-Path $scratch -PathType Container)) {
                Remove-Item -LiteralPath $scratch -Recurse -Force
              }
            } finally {
              Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Clean synthetic AI artifacts
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if (Test-Path "artifacts") { Remove-Item "artifacts" -Recurse -Force }

  prepare-task:
    name: Validate task and generate read-only AI plan
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'ai-task-next')
    outputs:
      issue_number: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
      candidate_ready: ${{ steps.candidate-tests.outcome == 'success' }}
      created_issue_number: ${{ steps.create-roadmap-task.outputs.created_issue_number }}
      lease_id: ${{ steps.reserve-task.outputs.lease_id }}
    permissions:
      actions: none
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Check durable circuit-breaker cooldown
        id: factory-gate
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'repository_dispatch' ||
          github.event_name == 'issues' ||
          github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: check
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs
      - name: Select one queued task for every queue trigger
        id: select-task
        if: >-
          (github.event_name == 'schedule' ||
           github.event_name == 'repository_dispatch' ||
           github.event_name == 'issues') &&
          steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_SKIPPED_ISSUES: ${{ steps.factory-gate.outputs.skipped_issues }}
          AGENT_FACTORY_STATE_ISSUE_NUMBER: ${{ steps.factory-gate.outputs.state_issue_number }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/select-agent-task.mjs

      - name: Generate one bounded roadmap task when the queue is truly empty
        id: create-roadmap-task
        if: >-
          (github.event_name == 'schedule' ||
           github.event_name == 'repository_dispatch' ||
           github.event_name == 'issues') &&
          steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '' &&
          steps.factory-gate.outputs.pending_tasks == '0' &&
          steps.select-task.outputs.blocked_by_dependencies == '0' &&
          steps.select-task.outputs.open_task_prs == '0' &&
          steps.select-task.outputs.issue_number == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: plan
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Reserve durable V2 worker lease
        id: reserve-task
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' &&
           steps.factory-gate.outputs.cooldown_active != 'true' &&
           steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: reserve
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          BASE_SHA: ${{ github.sha }}
          AGENT_FACTORY_LEASE_OWNER: ${{ runner.name }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Transition task to preparing
        if: steps.reserve-task.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          NEXT_TASK_STATE: preparing
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Validate task and create a safe handoff bundle
        id: prepare-task
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/prepare-agent-task.mjs

      - name: Transition task to planning
        if: steps.reserve-task.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          NEXT_TASK_STATE: planning
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Generate and validate a read-only plan with local Ollama
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/generate-agent-plan.mjs

      - name: Transition task to patching
        if: steps.reserve-task.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          NEXT_TASK_STATE: patching
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Generate and validate a bounded patch proposal
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/generate-agent-patch.mjs

      - name: Apply validated patch to a disposable scratch workspace
        id: apply-scratch
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/apply-agent-patch-to-scratch.mjs

      - name: Restore npm cache for isolated candidate installs
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agent-npm-cache
          key: agent-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            agent-npm-${{ runner.os }}-

      - name: Install candidate dependencies inside restricted container (attempt 1)
        id: install-first
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        timeout-minutes: 15
        continue-on-error: true
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          $scratch = [string]$manifest.scratch_dir
          if (-not (Test-Path $scratch -PathType Container)) { throw "Disposable scratch workspace is missing." }
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          docker image inspect $imageDigest *> $null
          if ($LASTEXITCODE -ne 0) {
            docker pull $imageDigest
            if ($LASTEXITCODE -ne 0) { throw "Unable to pull the pinned candidate test image." }
          }
          $workspaceMount = "type=bind,source=$scratch,target=/workspace"
          $npmCache = Join-Path $env:RUNNER_TEMP "agent-npm-cache"
          New-Item -ItemType Directory -Path $npmCache -Force | Out-Null
          $cacheMount = "type=bind,source=$npmCache,target=/npm-cache"
          docker run --rm --pull never --network bridge --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000 --mount $workspaceMount --mount $cacheMount --workdir /workspace --env HOME=/tmp/npm-home --env npm_config_cache=/npm-cache $imageDigest npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Candidate dependency installation attempt 1 failed (exit $LASTEXITCODE)." }

      - name: Retry candidate dependency installation once
        if: >-
          steps.install-first.outcome == 'failure' &&
          ((github.event_name == 'issues' && github.event.action != 'closed') ||
           github.event_name == 'workflow_dispatch' ||
           steps.select-task.outputs.issue_number != '')
        timeout-minutes: 15
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          Write-Warning "The first 15-minute dependency-install attempt failed or timed out; retrying once."
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          $scratch = [string]$manifest.scratch_dir
          if (-not (Test-Path $scratch -PathType Container)) { throw "Disposable scratch workspace is missing." }
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          $workspaceMount = "type=bind,source=$scratch,target=/workspace"
          $npmCache = Join-Path $env:RUNNER_TEMP "agent-npm-cache"
          New-Item -ItemType Directory -Path $npmCache -Force | Out-Null
          $cacheMount = "type=bind,source=$npmCache,target=/npm-cache"
          docker run --rm --pull never --network bridge --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000 --mount $workspaceMount --mount $cacheMount --workdir /workspace --env HOME=/tmp/npm-home --env npm_config_cache=/npm-cache $imageDigest npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Candidate dependency installation retry failed (exit $LASTEXITCODE)." }

      - name: Start restricted candidate test container
        id: candidate-container
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.issue_number != '' && steps.factory-gate.outputs.cooldown_active != 'true' && steps.factory-gate.outputs.active_task_issue_number == '') ||
          steps.select-task.outputs.issue_number != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          $scratch = [string]$manifest.scratch_dir
          if (-not (Test-Path $scratch -PathType Container)) { throw "Disposable scratch workspace is missing." }
          $imageDigest = "node@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a"
          $workspaceMount = "type=bind,source=$scratch,target=/workspace"
          $statusDir = Join-Path $env:RUNNER_TEMP "agent-candidate-test-status"
          New-Item -ItemType Directory -Path $statusDir -Force | Out-Null
          $statusFile = Join-Path $statusDir "exit-code"
          Remove-Item -LiteralPath $statusFile -Force -ErrorAction SilentlyContinue
          $statusMount = "type=bind,source=$statusDir,target=/candidate-status"
          $containerName = "agent-candidate-tests-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $null = & docker create --name $containerName --pull never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 --memory 3g --cpus 2 --user 1000:1000 --tmpfs /tmp:rw,noexec,nosuid,size=512m,uid=1000,gid=1000 --mount $workspaceMount --mount $statusMount --workdir /workspace --env HOME=/tmp/test-home $imageDigest sh -lc "sleep 3600"
          if ($LASTEXITCODE -ne 0) { throw "Unable to create the restricted candidate test container; recording a system-scoped infrastructure failure." }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "AGENT_FACTORY_CANDIDATE_CONTAINER_NAME=$containerName" + [Environment]::NewLine, [System.Text.UTF8Encoding]::new($false))
          $null = & docker start $containerName
          if ($LASTEXITCODE -ne 0) { throw "Unable to start the restricted candidate test container; recording a system-scoped infrastructure failure." }
          $running = & docker inspect --format '{{.State.Running}}' $containerName
          if ($LASTEXITCODE -ne 0 -or [string]$running -ne "true") { throw "Restricted candidate test container did not reach the running state; recording a system-scoped infrastructure failure." }
          Write-Host "PASS: restricted candidate test container is running; candidate commands have not started."

      - name: Test patched candidate offline inside restricted container
        id: candidate-tests
        if: steps.candidate-container.outcome == 'success'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $containerName = $env:AGENT_FACTORY_CANDIDATE_CONTAINER_NAME
          if ([string]::IsNullOrWhiteSpace($containerName)) { throw "Candidate test container identity is unavailable; recording a system-scoped infrastructure failure." }
          $statusFile = Join-Path (Join-Path $env:RUNNER_TEMP "agent-candidate-test-status") "exit-code"
          $testLog = Join-Path $env:RUNNER_TEMP "agent-preflight-offline-test.log"
          $testCommand = 'set +e; npm run test:unit && npx --no-install tsc --noEmit && npm run lint; result=$?; printf "%s\n" "$result" > /candidate-status/exit-code; exit 0'
          $testOutput = & docker exec $containerName sh -lc $testCommand 2>&1
          $dockerExecExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host "$_" }
          $testOutput | Out-File -LiteralPath $testLog -Encoding utf8
          if ($dockerExecExitCode -ne 0) { throw "Unable to execute candidate commands in the already-running container; no task-failure marker was written, so this remains system-scoped." }
          if (-not (Test-Path -LiteralPath $statusFile -PathType Leaf)) { throw "Candidate command exit evidence is missing; no task-failure marker was written, so this remains system-scoped." }
          $candidateExitCodeText = (Get-Content -LiteralPath $statusFile -Raw).Trim()
          if ($candidateExitCodeText -notmatch '^\d+      - name: Preserve candidate offline test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-preflight-candidate-offline-test-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-preflight-offline-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Create a sanitized publication evidence manifest
        if: success() && steps.candidate-tests.outcome == 'success'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifest = Get-Content "artifacts/agent-scratch.json" -Raw | ConvertFrom-Json
          if ($manifest.schema_version -ne 2 -or
              [string]$manifest.base_commit -notmatch '^[0-9a-f]{40}$' -or
              $manifest.repository_files_modified -ne $false -or
              $manifest.generated_code_executed -ne $false -or
              @($manifest.patched_files).Count -lt 1) {
            throw "Scratch evidence is invalid; refusing to publish an unverified manifest."
          }
          $publicationManifest = [ordered]@{
            schema_version = [int]$manifest.schema_version
            base_commit = [string]$manifest.base_commit
            patched_files = @($manifest.patched_files)
            repository_files_modified = [bool]$manifest.repository_files_modified
            generated_code_executed = [bool]$manifest.generated_code_executed
          }
          $json = $publicationManifest | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText(
            "artifacts/agent-scratch-publication.json",
            $json + "`n",
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Upload exact validated publication bundle
        if: success() && steps.candidate-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-publication-${{ github.run_id }}
          path: |
            artifacts/agent-task.json
            artifacts/agent-plan.json
            artifacts/agent-patch.json
            artifacts/agent-scratch-publication.json
          if-no-files-found: error
          retention-days: 1

      - name: Classify known task-scoped failures before updating factory state
        if: failure()
        env:
          APPLY_SCRATCH_OUTCOME: ${{ steps.apply-scratch.outcome }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          if ($env:AGENT_FACTORY_FAILURE_SCOPE -eq "task" -or $env:APPLY_SCRATCH_OUTCOME -eq "failure") {
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "AGENT_FACTORY_FAILURE_SCOPE=task`n", [System.Text.UTF8Encoding]::new($false))
            Write-Host "Preserved or confirmed task-scoped validation failure."
          } else {
            Write-Host "No task-scoped failure was identified; defaulting to system-scoped."
          }

      - name: Record failed task and activate cooldown after three consecutive failures
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: failure
          FAILED_ISSUE_NUMBER: ${{ steps.select-task.outputs.issue_number || inputs.issue_number }}
          FAILURE_STAGE: preflight
          FAILURE_SUMMARY: 'Task workflow failed for issue #${{ steps.select-task.outputs.issue_number || inputs.issue_number }} in run ${{ github.run_id }}. Inspect the Actions run logs.'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

      - name: Clean disposable scratch workspace
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $manifestPath = "artifacts/agent-scratch.json"
          if (Test-Path $manifestPath) {
            try {
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              $scratch = [string]$manifest.scratch_dir
              if ($scratch -and (Test-Path $scratch -PathType Container)) {
                Remove-Item -LiteralPath $scratch -Recurse -Force
              }
            } finally {
              Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload validated task, plan, and patch proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-task-${{ github.event.issue.number || inputs.issue_number }}
          path: |
            artifacts/agent-task.json
            artifacts/agent-plan.json
            artifacts/agent-patch.json
          if-no-files-found: warn
          retention-days: 3

  dispatch-roadmap-task:
    name: Dispatch a newly planned roadmap task
    needs: [prepare-task]
    if: needs.prepare-task.outputs.created_issue_number != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the newly planned roadmap task
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'ai-task-next',
              client_payload: { source_issue: Number('${{ needs.prepare-task.outputs.created_issue_number }}'), outcome: 'planner_created' }
            });

  begin-publication:
    name: Record publishing state before granting publisher write access
    needs: [prepare-task]
    if: needs.prepare-task.result == 'success' && needs.prepare-task.outputs.candidate_ready == 'true' && needs.prepare-task.outputs.issue_number != '' && needs.prepare-task.outputs.lease_id != ''
    permissions:
      contents: read
      issues: write
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Transition task to publishing before PR creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ needs.prepare-task.outputs.issue_number }}
          AGENT_FACTORY_LEASE_ID: ${{ needs.prepare-task.outputs.lease_id }}
          NEXT_TASK_STATE: publishing
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/agent-factory-v2-controller.mjs

  publish-task:
    name: Publish the validated candidate with isolated write permissions
    needs: [prepare-task, begin-publication]
    if: needs.prepare-task.result == 'success' && needs.begin-publication.result == 'success' && needs.prepare-task.outputs.candidate_ready == 'true' && needs.prepare-task.outputs.issue_number != ''
    permissions:
      actions: read
      contents: write
      issues: none
      pull-requests: write
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Initialize sanitized publisher cooldown handoff
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          [System.IO.File]::WriteAllText("artifacts/agent-api-cooldown.txt", "", [System.Text.UTF8Encoding]::new($false))

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Download exact validated publication bundle
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-publication-${{ github.run_id }}
          path: artifacts

      - name: Restore sanitized scratch evidence for publisher validation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $source = "artifacts/agent-scratch-publication.json"
          $destination = "artifacts/agent-scratch.json"
          if (-not (Test-Path $source -PathType Leaf)) { throw "Sanitized scratch evidence is missing." }
          Move-Item -LiteralPath $source -Destination $destination -Force

      - name: Create a draft PR after isolated tests pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.prepare-task.outputs.issue_number }}
          CANDIDATE_TESTS_PASSED: "true"
          PUBLISH_SKIP_ISSUE_COMMENT: "true"
          AGENT_FACTORY_API_COOLDOWN_FILE: artifacts/agent-api-cooldown.txt
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/publish-agent-patch.mjs

      - name: Upload sanitized publisher cooldown for the durable failure callback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-api-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/agent-api-cooldown.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload publication result for the state writer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-publication-result-${{ github.run_id }}
          path: artifacts/agent-publish.json
          if-no-files-found: error
          retention-days: 1

  record-publication:
    name: Record publication state with issue-only write permissions
    needs: [prepare-task, begin-publication, publish-task]
    if: >-
      always() &&
      needs.prepare-task.result == 'success' &&
      needs.prepare-task.outputs.candidate_ready == 'true' &&
      needs.prepare-task.outputs.issue_number != ''
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      queue: max
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Download sanitized publisher cooldown handoff
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-api-cooldown-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cooldown

      - name: Restore validated publisher cooldown for durable failure callback
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/restore-agent-factory-api-cooldown.mjs "artifacts/cooldown/agent-api-cooldown.txt" "$env:GITHUB_ENV"
          if ($LASTEXITCODE -ne 0) { throw "Unable to restore publisher cooldown handoff." }

      - name: Download publication result
        if: needs.publish-task.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ai-agent-publication-result-${{ github.run_id }}
          path: artifacts

      - name: Record candidate PR state and release worker lease
        id: record-publication
        if: needs.publish-task.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: transition
          ISSUE_NUMBER: ${{ needs.prepare-task.outputs.issue_number }}
          AGENT_FACTORY_LEASE_ID: ${{ needs.prepare-task.outputs.lease_id }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $publish = Get-Content "artifacts/agent-publish.json" -Raw | ConvertFrom-Json
          if ($publish.different_candidate_branch -eq $true) {
            $env:NEXT_TASK_STATE = "superseded"
            node scripts/agent-factory-v2-controller.mjs
            if ($LASTEXITCODE -ne 0) { throw "Unable to release superseded task lease." }
          } else {
            if ([string]$publish.commit_sha -notmatch '^[0-9a-f]{40}$' -or
                [int]$publish.pull_request_number -lt 1) {
              throw "Publisher did not return exact candidate commit and PR evidence."
            }
            $pullNumber = [int]$publish.pull_request_number
            if ($pullNumber -lt 1) {
              throw "Publisher returned an invalid pull-request number."
            }
            $pullUrl = [string]$publish.pull_request_url
            $expectedPullUrl = "https://github.com/$env:GITHUB_REPOSITORY/pull/$pullNumber"
            if ($pullUrl -cne $expectedPullUrl) {
              throw "Publisher returned a pull-request URL outside the exact target repository and PR number."
            }
            $env:HEAD_SHA = [string]$publish.commit_sha
            $env:PULL_REQUEST_NUMBER = [string]$pullNumber
            $env:NEXT_TASK_STATE = "draft_pr_created"
            node scripts/agent-factory-v2-controller.mjs
            if ($LASTEXITCODE -ne 0) { throw "Unable to record the exact draft PR candidate." }
            $env:NEXT_TASK_STATE = "awaiting_ci"
