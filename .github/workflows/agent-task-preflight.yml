name: AI Agent Task Preflight

on:
  push:
    branches:
      - codex/ai-runner-foundation
    paths:
      - "lib/agent-task-validation.mjs"
      - "scripts/prepare-agent-task.mjs"
      - "tests/agent-task-validation.test.mjs"
      - "package.json"
      - ".github/workflows/agent-task-preflight.yml"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Repository issue number containing the approved AI task"
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: ai-agent-task-preflight
  cancel-in-progress: false

jobs:
  validation-tests:
    name: Windows self-hosted project validation
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node --version
          npm --version

      - name: Audit available local isolation capabilities
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          try {
            $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
            Write-Host "OS: $($os.Caption) | Version: $($os.Version) | Build: $($os.BuildNumber)"
          } catch {
            Write-Host "OS metadata query unavailable: $($_.Exception.Message)"
          }

          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          if ($wsl) {
            Write-Host "WSL: installed"
            wsl.exe --status
            if ($LASTEXITCODE -ne 0) { Write-Host "WSL status query returned $LASTEXITCODE" }
          } else {
            Write-Host "WSL: not found"
          }

          $docker = Get-Command docker.exe -ErrorAction SilentlyContinue
          if ($docker) {
            Write-Host "Docker CLI: installed"
            docker.exe --version
            docker.exe info --format "Server={{.ServerVersion}} OS={{.OperatingSystem}}"
            if ($LASTEXITCODE -ne 0) { Write-Host "Docker daemon is unavailable (exit $LASTEXITCODE)" }
          } else {
            Write-Host "Docker CLI: not found"
          }

          try {
            $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop
            Write-Host "HypervisorPresent: $($computer.HypervisorPresent)"
          } catch {
            Write-Host "Hypervisor status query unavailable"
          }

          $featureCmd = Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue
          if ($featureCmd) {
            try {
              $sandbox = Get-WindowsOptionalFeature -Online -FeatureName Containers-DisposableClientVM -ErrorAction Stop
              Write-Host "Windows Sandbox feature: $($sandbox.State)"
            } catch {
              Write-Host "Windows Sandbox feature query unavailable (possibly requires elevation): $($_.Exception.Message)"
            }
          } else {
            Write-Host "Windows feature query cmdlet: not available"
          }

      - name: Install locked dependencies without lifecycle scripts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete unit test suite
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run test:unit

      - name: Run TypeScript validation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npx --no-install tsc --noEmit

      - name: Run ESLint
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: npm run lint

  prepare-task:
    name: Validate and package one task (no AI execution)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate task and create a safe handoff bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: node scripts/prepare-agent-task.mjs

      - name: Upload task bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-task-${{ inputs.issue_number }}
          path: artifacts/agent-task.json
          if-no-files-found: error
          retention-days: 3
