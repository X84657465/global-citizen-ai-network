name: Agent Factory System Health Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  diagnose-recovery-trigger:
    name: Record safe workflow_run gate diagnostics
    # This read-only job runs even when reset-system-breaker is skipped.
    # It records only non-secret event identity and predicate results so a
    # skipped recovery decision is attributable without weakening its gate.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report recovery trigger metadata and gate predicates
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const predicates = {
            expected_workflow_path: env.WORKFLOW_PATH === ".github/workflows/ci.yml",
            source_conclusion_success: env.WORKFLOW_CONCLUSION === "success",
            source_event_pull_request: env.WORKFLOW_EVENT === "pull_request",
            source_repository_matches: env.HEAD_REPOSITORY === env.TARGET_REPOSITORY,
            branch_not_ai_task: !env.HEAD_BRANCH.startsWith("ai-task/issue-"),
            branch_not_codex_task: !env.HEAD_BRANCH.startsWith("codex/issue-"),
          };
          console.log(JSON.stringify({
            diagnostic: "factory_recovery_trigger",
            target_repository: env.TARGET_REPOSITORY,
            workflow_path: env.WORKFLOW_PATH,
            workflow_conclusion: env.WORKFLOW_CONCLUSION,
            workflow_event: env.WORKFLOW_EVENT,
            head_repository: env.HEAD_REPOSITORY,
            head_branch: env.HEAD_BRANCH,
            head_sha: env.HEAD_SHA,
            source_run_id: env.SOURCE_RUN_ID,
            source_run_attempt: env.SOURCE_RUN_ATTEMPT,
            predicates,
            all_job_level_predicates_pass: Object.values(predicates).every(Boolean),
          }, null, 2));
          NODE

  reset-system-breaker:
    name: Verify completed exact-head CI before resetting system breaker
    # Only one trusted, same-repository, non-task PR targeting main may
    # request system-health recovery after its source CI run has completed.
    # All other workflow_run events skip before queue acquisition.
    # Recovery is a GitHub API/state operation; keep execution off the Windows
    # Runner so it does not consume local execution capacity. This job still
    # waits in the shared cross-process state-writer queue and may queue behind
    # CI workloads. That ordering is intentional: durable Factory state writes
    # must remain serialized until an independently verified atomic CAS/lease
    # protocol replaces the repository-wide concurrency fence.
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      cancel-in-progress: false
      queue: max
    if: >-
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'ai-task/issue-') &&
      !startsWith(github.event.workflow_run.head_branch, 'codex/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted mainline controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Resolve and verify the unique exact-head main PR
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const sha = process.env.WORKFLOW_HEAD_SHA;
          const ref = process.env.WORKFLOW_HEAD_REF;
          if (!/^[0-9a-f]{40}$/i.test(sha || "")) throw new Error("Invalid workflow head SHA.");
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${sha}/pulls`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
          });
          if (!response.ok) throw new Error(`Unable to resolve PR for exact workflow SHA: HTTP ${response.status}`);
          const prs = await response.json();
          const matches = prs.filter(pr => pr.state === "open" && pr.base?.ref === "main" &&
            pr.base?.repo?.full_name === process.env.GITHUB_REPOSITORY &&
            pr.head?.repo?.full_name === process.env.GITHUB_REPOSITORY &&
            pr.head?.sha === sha && pr.head?.ref === ref);
          if (matches.length === 0) {
            await import("node:fs").then(({ appendFileSync }) => appendFileSync(process.env.GITHUB_OUTPUT, "should_recover=false\\n"));
            console.log(`No open PR matches completed CI SHA ${sha}; treating stale or closed-PR CI as a no-op.`);
            process.exit(0);
          }
          if (matches.length > 1) throw new Error(`Ambiguous exact-head PR resolution; found ${matches.length} matches.`);
          const pr = matches[0];
          if (pr.head.ref.startsWith("ai-task/issue-") || pr.head.ref.startsWith("codex/issue-")) throw new Error("Task PRs cannot reset the system breaker.");
          await import("node:fs").then(({ appendFileSync }) => appendFileSync(process.env.GITHUB_OUTPUT, `should_recover=true\\nnumber=${pr.number}\\nhead_sha=${pr.head.sha}\\n`));
          console.log(`Verified PR #${pr.number} at exact SHA ${sha}.`);
          NODE

      - name: Verify completed CI provenance and reset global breaker
        if: steps.resolve-pr.outputs.should_recover == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: system-health-success
          SYSTEM_HEALTH_RUN_ID: ${{ github.event.workflow_run.id }}
          SYSTEM_HEALTH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SYSTEM_HEALTH_PULL_REQUEST_NUMBER: ${{ steps.resolve-pr.outputs.number }}
          SYSTEM_HEALTH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SYSTEM_HEALTH_PR_HEAD_SHA: ${{ steps.resolve-pr.outputs.head_sha }}
        shell: bash
        run: node scripts/agent-factory-v2-controller.mjs
