name: Agent Factory System Health Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  reset-system-breaker:
    name: Verify completed exact-head CI before resetting system breaker
    # Always start a lightweight observer job for completed CI events so
    # ineligible events are recorded instead of disappearing as zero-job runs.
    # Only a verified same-repository, non-task PR at the exact source SHA may
    # reach the state-changing controller step.
    # Recovery is a GitHub API/state operation; keep execution off the Windows
    # Runner so it does not consume local execution capacity. This job still
    # waits in the shared cross-process state-writer queue and may queue behind
    # CI workloads. That ordering is intentional: durable Factory state writes
    # must remain serialized until an independently verified atomic CAS/lease
    # protocol replaces the repository-wide concurrency fence.
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted mainline controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Resolve and verify the unique exact-head main PR
        id: resolve-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          const sha = process.env.WORKFLOW_HEAD_SHA;
          const ref = process.env.WORKFLOW_HEAD_REF;
          const reject = async reason => {
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, "should_recover=false\n");
            console.log(`Recovery not eligible: ${reason}`);
          };
          const eligibility = [
            [process.env.WORKFLOW_PATH === ".github/workflows/ci.yml", "unexpected source workflow path"],
            [process.env.WORKFLOW_CONCLUSION === "success", "source CI did not succeed"],
            [process.env.WORKFLOW_EVENT === "pull_request", "source event is not pull_request"],
            [process.env.WORKFLOW_HEAD_REPOSITORY === process.env.GITHUB_REPOSITORY, "source head repository is not trusted"],
            [!ref?.startsWith("ai-task/issue-") && !ref?.startsWith("codex/issue-"), "task PR branches cannot reset the breaker"],
          ];
          const failed = eligibility.find(([ok]) => !ok);
          if (failed) {
            await reject(failed[1]);
            process.exit(0);
          }
          if (!/^[0-9a-f]{40}$/i.test(sha || "")) throw new Error("Invalid workflow head SHA.");
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits/${sha}/pulls`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
          });
          if (!response.ok) throw new Error(`Unable to resolve PR for exact workflow SHA: HTTP ${response.status}`);
          const prs = await response.json();
          const matches = prs.filter(pr => pr.state === "open" && pr.base?.ref === "main" &&
            pr.base?.repo?.full_name === process.env.GITHUB_REPOSITORY &&
            pr.head?.repo?.full_name === process.env.GITHUB_REPOSITORY &&
            pr.head?.sha === sha && pr.head?.ref === ref);
          if (matches.length === 0) {
            await import("node:fs").then(({ appendFileSync }) => appendFileSync(process.env.GITHUB_OUTPUT, "should_recover=false\n"));
            console.log(`No open PR matches completed CI SHA ${sha}; treating stale or closed-PR CI as a no-op.`);
            process.exit(0);
          }
          if (matches.length > 1) throw new Error(`Ambiguous exact-head PR resolution; found ${matches.length} matches.`);
          const pr = matches[0];
          await import("node:fs").then(({ appendFileSync }) => appendFileSync(process.env.GITHUB_OUTPUT, `should_recover=true\nnumber=${pr.number}\nhead_sha=${pr.head.sha}\n`));
          console.log(`Verified PR #${pr.number} at exact SHA ${sha}.`);
          NODE

      - name: Verify completed CI provenance and reset global breaker
        id: recovery
        if: steps.resolve-pr.outputs.should_recover == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: system-health-success
          SYSTEM_HEALTH_RUN_ID: ${{ github.event.workflow_run.id }}
          SYSTEM_HEALTH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SYSTEM_HEALTH_PULL_REQUEST_NUMBER: ${{ steps.resolve-pr.outputs.number }}
          SYSTEM_HEALTH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SYSTEM_HEALTH_PR_HEAD_SHA: ${{ steps.resolve-pr.outputs.head_sha }}
        shell: bash
        run: |
          set +e
          node scripts/agent-factory-v2-controller.mjs
          controller_exit=$?
          exit "$controller_exit"

      - name: Write redacted recovery diagnostic summary
        if: always()
        shell: bash
        env:
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_REF: ${{ github.event.workflow_run.head_branch }}
          SOURCE_CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_CI_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CI_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          RESOLVED_PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
          RESOLVER_OUTCOME: ${{ steps.resolve-pr.outcome }}
          CONTROLLER_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          {
            printf 'schema_version=1\n'
            printf 'recovery_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'recovery_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_ci_run_id=%s\n' "$SOURCE_CI_RUN_ID"
            printf 'source_ci_run_attempt=%s\n' "$SOURCE_CI_RUN_ATTEMPT"
            printf 'source_ci_head_sha=%s\n' "$SOURCE_CI_SHA"
            printf 'source_ci_head_ref=%s\n' "$SOURCE_CI_REF"
            printf 'source_ci_conclusion=%s\n' "$SOURCE_CI_CONCLUSION"
            printf 'source_ci_event=%s\n' "$SOURCE_CI_EVENT"
            printf 'source_ci_head_repository=%s\n' "$SOURCE_CI_REPOSITORY"
            printf 'resolved_pr_number=%s\n' "$RESOLVED_PR_NUMBER"
            printf 'resolver_step_outcome=%s\n' "$RESOLVER_OUTCOME"
            printf 'controller_step_outcome=%s\n' "$CONTROLLER_OUTCOME"
          } > "$RUNNER_TEMP/system-health-recovery-summary.txt"

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-health-recovery-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-health-recovery-summary.txt
          if-no-files-found: error
          retention-days: 30
