name: Agent Factory System Health Recovery

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  reset-system-breaker:
    name: Verify completed exact-head CI before resetting system breaker
    # Only successful, trusted PR CI runs should reserve the shared state-writer queue.
    # Cancelled/failed/non-PR workflow_run events are skipped without queueing.
    concurrency:
      group: global-citizen-ai-network-self-hosted-runner
      cancel-in-progress: false
      queue: max
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted mainline controller
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"

      - name: Verify completed CI provenance and reset global breaker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: system-health-success
          SYSTEM_HEALTH_RUN_ID: ${{ github.event.workflow_run.id }}
          SYSTEM_HEALTH_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SYSTEM_HEALTH_PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SYSTEM_HEALTH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/agent-factory-v2-controller.mjs
