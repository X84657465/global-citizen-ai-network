name: Generate dependency lockfile artifact

on:
  push:
    branches: [codex/dependency-lockfile-generator]
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/generate-lockfile.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.ref == 'refs/heads/codex/dependency-lockfile-generator' || startsWith(github.head_ref, 'codex/dependency-lockfile')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit
      - name: Commit generated lockfile to the fixed bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current"
          else
            git commit -m "chore(deps): add npm lockfile"
            git push origin HEAD:codex/dependency-lockfile-generator
          fi
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
