name: PR Acceptance Gate
# A base-branch retarget does not emit a CI synchronize event; keep this follow-up commit auditable.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: ["CI", "AI Agent Task Preflight"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open pull request number targeting main"
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  resolve-target:
    name: Resolve unique PR target for acceptance serialization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve PR identity before acquiring its advisory-write queue
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const pullRequest = context.payload.pull_request;
            let prNumber = pullRequest && pullRequest.number;
            let headSha = (pullRequest && pullRequest.head && pullRequest.head.sha) ||
              (run && run.head_sha) || context.sha;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = Number(context.payload.inputs && context.payload.inputs.pr_number) || null;
            } else if (context.eventName === 'workflow_run' && !prNumber) {
              const payloadPrs = run && run.pull_requests;
              if (Array.isArray(payloadPrs) && payloadPrs.length === 1) {
                prNumber = payloadPrs[0].number;
              } else if (headSha) {
                const associated = await github.request(
                  'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                  { owner, repo, commit_sha: headSha, headers: { accept: 'application/vnd.github+json' } }
                );
                const matches = associated.data.filter(item =>
                  item.state === 'open' &&
                  item.base && item.base.ref === 'main' &&
                  item.head && item.head.sha === headSha &&
                  item.base.repo && item.base.repo.full_name === owner + '/' + repo
                );
                if (matches.length === 1) prNumber = matches[0].number;
              }
            }

            core.setOutput('pr_number', prNumber ? String(prNumber) : '');
            core.setOutput('head_sha', headSha || '');

  evaluate:
    needs: [resolve-target]
    if: needs.resolve-target.outputs.pr_number != ''
    concurrency:
      # Resolve the PR before entering the queue so workflow_run events with
      # multiple payload associations use the same unique PR key as PR events.
      # If no unique PR can be resolved, isolate the event by its exact source SHA.
      group: global-citizen-ai-network-pr-acceptance-${{ needs.resolve-target.outputs.pr_number || needs.resolve-target.outputs.head_sha || github.sha }}
      cancel-in-progress: false
      queue: max
    name: PR Acceptance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate exact-head acceptance policy
        uses: actions/github-script@v7
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}
          RESOLVED_HEAD_SHA: ${{ needs.resolve-target.outputs.head_sha }}
          REQUIRED_CI_WORKFLOW: ci.yml
          REQUIRED_PREFLIGHT_WORKFLOW: agent-task-preflight.yml
        with:
          script: |
            const path = require('path');
            const policyPath = path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'pr-acceptance-policy.cjs');
            const { evaluateAcceptance, REQUIRED_CI_JOBS } = require(policyPath);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- pr-acceptance-gate -->';
            const holdLabel = 'merge-hold';

            // Consume the exact identity resolved before this job entered its per-PR queue.
            // Never resolve a second time inside the serialized evaluator.
            const prNumber = Number(process.env.RESOLVED_PR_NUMBER) || null;
            const eventSha = context.eventName === 'workflow_dispatch'
              ? null
              : (process.env.RESOLVED_HEAD_SHA || null);

            if (!prNumber) {
              core.notice('No unique open main-target PR is associated with this workflow event; no PR was changed.');
              return;
            }

            const prResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const pr = prResponse.data;
            if (pr.state !== 'open' || pr.base.ref !== 'main') {
              core.notice('PR #' + prNumber + ' is not an open PR targeting main; no action taken.');
              return;
            }
            const headSha = pr.head.sha;
            if (eventSha && eventSha !== headSha) {
              core.warning('Stale event SHA ' + eventSha + ' differs from current PR SHA ' + headSha + '; only current SHA is evaluated.');
            }

            // Select one exact CI workflow run first; never assemble jobs from Check Runs across runs.
            const workflowResponse = await github.request(
              'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}',
              { owner, repo, workflow_id: 'ci.yml', headers: { accept: 'application/vnd.github+json' } }
            );
            const workflow = workflowResponse.data;
            if (workflow.path !== '.github/workflows/ci.yml') {
              throw new Error('CI workflow path did not match the required trusted workflow.');
            }
            const workflowRunsResponse = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: workflow.id, head_sha: headSha,
              event: 'pull_request', per_page: 100
            });
            const matchingRuns = workflowRunsResponse.data.workflow_runs
              .filter(run => run.head_sha === headSha && run.head_branch === pr.head.ref &&
                run.event === 'pull_request' && run.path === '.github/workflows/ci.yml')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const selectedRun = matchingRuns[0] || null;
            let ci = { workflowId: workflow.id, workflowPath: workflow.path, event: 'pull_request',
              runId: selectedRun ? selectedRun.id : null,
              runAttempt: selectedRun ? selectedRun.run_attempt : null,
              headSha, status: selectedRun ? selectedRun.status : 'missing',
              conclusion: selectedRun ? selectedRun.conclusion : null, jobs: [] };
            if (selectedRun) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
                owner, repo, run_id: selectedRun.id, attempt_number: selectedRun.run_attempt, per_page: 100
              });
              ci.jobs = jobsResponse.data.jobs.map(job => ({
                name: job.name, runId: job.run_id, runAttempt: job.run_attempt,
                status: job.status, conclusion: job.conclusion
              }));
            }
            // Check runs remain informational only; Preflight acceptance is bound to its exact workflow run/attempt.
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: headSha, per_page: 100
            });
            const preflightPaths = new Set([
              'lib/agent-task-validation.mjs',
              'lib/agent-patch-validation.mjs',
              'lib/agent-plan-validation.mjs',
              'scripts/prepare-agent-task.mjs',
              'scripts/select-agent-task.mjs',
              'scripts/agent-factory-controller.mjs',
              'scripts/agent-factory-v2-controller.mjs',
              'lib/agent-factory-controller.mjs',
              'lib/agent-failure-scope.mjs',
              'tests/agent-failure-scope.test.mjs',
              'lib/agent-factory-state-machine.mjs',
              'lib/agent-factory-state-store.mjs',
              'lib/agent-task-queue.mjs',
              'lib/github-api-client.mjs',
              'lib/github-pagination.mjs',
              'lib/agent-path-safety.mjs',
              'lib/agent-scratch-evidence.mjs',
              'lib/agent-publisher-branch.mjs',
              'lib/agent-task-pr-metadata.mjs',
              'scripts/resolve-agent-task-pr.mjs',
              'lib/agent-factory-policy.mjs',
              'tests/agent-factory-policy.test.mjs',
              'tests/agent-task-queue.test.mjs',
              'tests/github-api-client.test.mjs',
              'tests/github-pagination.test.mjs',
              'scripts/generate-agent-plan.mjs',
              'scripts/generate-agent-patch.mjs',
              'scripts/apply-agent-patch-to-scratch.mjs',
              'tests/agent-patch-to-scratch.test.mjs',
              'scripts/publish-agent-patch.mjs',
              'tests/agent-task-validation.test.mjs',
              'tests/agent-patch-validation.test.mjs',
              'tests/agent-plan-validation.test.mjs',
              'tests/agent-factory-controller.test.mjs',
              'tests/agent-factory-lifecycle.integration.test.mjs',
              'tests/agent-factory-state-machine.test.mjs',
              'tests/agent-factory-state-store.test.mjs',
              'tests/agent-path-safety.test.mjs',
              'tests/agent-scratch-evidence.test.mjs',
              'tests/agent-publisher-branch.test.mjs',
              'tests/agent-task-pr-metadata.test.mjs',
              'eslint.config.mjs',
              'package.json',
              '.github/workflows/ci.yml'
            ]);
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100
            });
            const preflightApplicable = changedFiles.some(file =>
              preflightPaths.has(file.filename) || (file.previous_filename && preflightPaths.has(file.previous_filename))
            );
            let preflight = { applicable: false, status: 'not_applicable' };
            if (preflightApplicable) {
            const preflightWorkflowResponse = await github.request(
              'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}',
              { owner, repo, workflow_id: 'agent-task-preflight.yml', headers: { accept: 'application/vnd.github+json' } }
            );
            const preflightWorkflow = preflightWorkflowResponse.data;
            if (preflightWorkflow.path !== '.github/workflows/agent-task-preflight.yml') {
              throw new Error('Preflight workflow path did not match the required trusted workflow.');
            }
            const preflightRunsResponse = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: preflightWorkflow.id, head_sha: headSha,
              event: 'pull_request', per_page: 100
            });
            const matchingPreflightRuns = preflightRunsResponse.data.workflow_runs
              .filter(run => run.head_sha === headSha && run.head_branch === pr.head.ref &&
                run.event === 'pull_request' && run.path === '.github/workflows/agent-task-preflight.yml')
              .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            const selectedPreflightRun = matchingPreflightRuns[0] || null;
            preflight = {
              applicable: true, workflowId: preflightWorkflow.id,
              workflowPath: preflightWorkflow.path, event: 'pull_request',
              runId: selectedPreflightRun ? selectedPreflightRun.id : null,
              runAttempt: selectedPreflightRun ? selectedPreflightRun.run_attempt : null,
              headSha, status: selectedPreflightRun ? selectedPreflightRun.status : 'missing',
              conclusion: selectedPreflightRun ? selectedPreflightRun.conclusion : null,
              jobs: []
            };
            if (selectedPreflightRun) {
              const preflightJobsResponse = await github.rest.actions.listJobsForWorkflowRunAttempt({
                owner, repo, run_id: selectedPreflightRun.id,
                attempt_number: selectedPreflightRun.run_attempt, per_page: 100
              });
              preflight.jobs = preflightJobsResponse.data.jobs.map(job => ({
                name: job.name, runId: job.run_id, runAttempt: job.run_attempt,
                status: job.status, conclusion: job.conclusion
              }));
            }
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: prNumber, per_page: 100
            });
            const latestReviewByUser = new Map();
            const effectiveReviewStates = new Set(['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']);
            reviews.sort((a, b) => new Date(a.submitted_at || 0) - new Date(b.submitted_at || 0));
            for (const review of reviews) {
              if (review.user && review.user.login && effectiveReviewStates.has(review.state)) {
                latestReviewByUser.set(review.user.login, review);
              }
            }
            const hasCurrentHeadApproval = Array.from(latestReviewByUser.values()).some(review =>
              review.user.login !== pr.user.login &&
              review.state === 'APPROVED' &&
              review.commit_id === headSha
            );

            const statusResponse = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha });
            const externalSignals = []
              .concat(statusResponse.data.statuses.map(status => ({
                name: status.context, state: status.state, targetUrl: status.target_url
              })))
              .concat(checkRuns.map(check => ({
                name: check.name, state: check.conclusion || check.status, targetUrl: check.html_url
              })))
              .filter(signal => /vercel|circleci/i.test(signal.name));

            const evaluation = evaluateAcceptance({
              currentHeadSha: headSha,
              ci,
              preflight,
              hasCurrentHeadApproval,
              mergeable: pr.mergeable,
              draft: pr.draft
            });

            const externalSummary = externalSignals.length
              ? externalSignals.map(item => '- ' + item.name + ': ' + item.state + ' (' + (item.targetUrl || 'no URL') + ')').join('\n')
              : '- No Vercel/CircleCI signal found on the current SHA.';
            const failureSummary = evaluation.failures.length
              ? evaluation.failures.map(item => '- **' + item.code + '**: ' + item.detail).join('\n')
              : '- All configured acceptance checks passed.';
            const body = [
              marker,
              '## PR Acceptance Gate',
              '- PR: #' + prNumber,
              '- Evaluated HEAD SHA: ' + headSha,
              '- Result: **' + (evaluation.accepted ? 'ACCEPTED' : 'HOLD') + '**',
              '- Preflight: ' + evaluation.preflight,
              '',
              '### Acceptance findings',
              failureSummary,
              '',
              '### External service signals (informational; not classified as code failures)',
              externalSummary,
              '',
              '> Advisory only: without Branch Protection/Rulesets, this workflow cannot technically prevent a user with merge permission from bypassing it. A merge-hold label or Draft state is not a server-side merge lock.'
            ].join('\n');

            const labelResponse = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const hasHoldLabel = labelResponse.data.some(label => label.name === holdLabel);

            const currentPrResponse = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (currentPrResponse.data.head.sha !== headSha) {
              core.setFailed('PR #' + prNumber + ' advanced from evaluated SHA ' + headSha + ' to ' +
                currentPrResponse.data.head.sha + '; skipping stale acceptance updates.');
              return;
            }
            if (!evaluation.accepted) {
              if (!hasHoldLabel) {
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: holdLabel, color: 'B60205',
                    description: 'Advisory hold: PR acceptance gate has not passed.'
                  });
                } catch (error) {
                  if (error.status !== 422) throw error;
                }
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [holdLabel] });
              }
              // Keep the PR Ready while CI is pending or acceptance is on HOLD.
              // The merge-hold label and exact-SHA report are advisory; never mutate review state here.
            } else if (hasHoldLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: holdLabel });
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const previous = comments.find(comment => comment.body && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            core.info('PR #' + prNumber + ' evaluated at exact SHA ' + headSha + ': ' + (evaluation.accepted ? 'ACCEPTED' : 'HOLD'));
            if (!evaluation.accepted) {
              core.setFailed('PR #' + prNumber + ' failed acceptance: ' + evaluation.failures.map(item => item.code).join(', '));
            }
