name: Independent review governance
run-name: Review gate — ${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number || github.event.workflow_run.pull_requests[0].number || 'PR' }}

on:
  pull_request:
    # Run for every target branch, including stacked Governance/Migration/B integration bases.
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  issues: read

jobs:
  review-gate:
    name: review-gate
    # This policy check only calls GitHub APIs; do not consume the scarce Windows factory runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Evaluate independent review policy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number ??
              context.payload.pull_request_review?.pull_request?.number ??
              context.payload.workflow_run?.pull_requests?.[0]?.number;
            if (context.eventName === "workflow_run" && context.payload.workflow_run?.event !== "pull_request") {
              core.info("Ignoring CI completion that was not triggered by a pull request.");
            } else if (!prNumber) {
              core.setFailed("Cannot resolve pull request number from event.");
            } else {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const headSha = pr.head.sha;
              const headRef = pr.head.ref;
              const baseRef = pr.base.ref;
              const failures = [];
              const notes = [];
            
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              const highRiskPattern = /(^\.github\/workflows\/|^supabase\/migrations\/|(^|\/)(schema|rls|polic|auth|security|payment)(\/|\.|-)|^lib\/agent-factory-|^scripts\/|^package(-lock)?\.json$|^middleware\.)/i;
              const highRisk = files.some(f => highRiskPattern.test(f.filename)) ||
                (pr.labels || []).some(l => ["risk:high", "cross-track", "migration", "security"].includes(l.name));
              const approvalThreshold = highRisk ? 2 : 1;
              notes.push(`Risk class: ${highRisk ? "HIGH" : "LOW"}; independent approvals required: ${approvalThreshold}.`);

              const { data: baseBranch } = await github.rest.repos.getBranch({ owner, repo, branch: baseRef });
              if (baseBranch.commit.sha !== pr.base.sha) failures.push(`PR base SHA ${pr.base.sha} is stale; current ${baseRef} is ${baseBranch.commit.sha}.`);
              if (baseRef !== "main") {
                const { data: parents } = await github.rest.pulls.list({
                  owner, repo, state: "all", head: `${owner}:${baseRef}`, per_page: 100
                });
                const parent = parents.find(p => p.number !== prNumber);
                if (!parent) failures.push(`Non-default base ${baseRef} has no matching parent PR; base relationship is unverified.`);
                else if (!parent.merged) failures.push(`Stack parent PR #${parent.number} is not merged; child cannot be accepted yet.`);
                else failures.push(`Stack parent PR #${parent.number} is merged; retarget/restack this child to ${parent.base.ref} and rerun exact-HEAD CI.`);
              }

              if ((pr.labels || []).some(l => ["blocked", "blocked-by"].includes(l.name))) {
                failures.push("PR has a blocking label.");
              }
              const blockerMatch = pr.body?.match(/^\s*Blocked by\s*:\s*(.+)$/im);
              if (blockerMatch) {
                const blockerNumbers = [...blockerMatch[1].matchAll(/#(\d+)/g)].map(m => Number(m[1]));
                if (!blockerNumbers.length) failures.push("Blocked by line exists but contains no parseable issue references.");
                for (const issueNumber of blockerNumbers) {
                  const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  if (issue.state !== "closed") failures.push(`Declared blocker #${issueNumber} is still open.`);
                }
              }

              let exactCi = null;
              for (let attempt = 0; attempt <= 30; attempt += 1) {
                const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner, repo, head_sha: headSha, event: "pull_request", per_page: 100
                });
                const exactCiRuns = runs.workflow_runs.filter(r =>
                  r.head_sha === headSha &&
                  (r.name === "CI" || (r.name || "").startsWith("CI —") || (r.display_title || "").startsWith("CI —"))
                ).sort((a, b) =>
                  new Date(b.run_started_at || b.created_at || 0) - new Date(a.run_started_at || a.created_at || 0)
                );
                exactCi = exactCiRuns[0] ?? null;
                if (exactCi?.status === "completed") break;
                if (attempt < 30) {
                  core.info(`Waiting for exact-HEAD CI to complete (attempt ${attempt + 1}/30)${exactCi ? `; run ${exactCi.id} is ${exactCi.status}.` : "; run not visible yet."}`);
                  await new Promise(resolve => setTimeout(resolve, 30000));
                }
              }
              if (!exactCi || exactCi.status !== "completed" || exactCi.conclusion !== "success") {
                failures.push(`Latest exact-HEAD CI run did not complete successfully for ${headSha}${exactCi ? ` (run ${exactCi.id}: ${exactCi.status}/${exactCi.conclusion || "pending"}).` : " (no run found after 15 minutes)."}`);
              } else notes.push(`Latest exact-HEAD CI passed: run ${exactCi.id}.`);

              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              const latestCommit = commits[commits.length - 1];
              const executionMatch = pr.body?.match(/^\s*Execution identity\s*:\s*(.+)$/im);
              const declaredExecutors = executionMatch ? [...executionMatch[1].matchAll(/@?([A-Za-z0-9-]+)/g)].map(m => m[1]) : [];
              const excluded = new Set([
                pr.user.login,
                latestCommit?.author?.login,
                latestCommit?.committer?.login,
                ...declaredExecutors
              ].filter(Boolean));
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: prNumber, per_page: 100
              });
              const latestByReviewer = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!login) continue;
                const previous = latestByReviewer.get(login);
                if (!previous || new Date(review.submitted_at || 0) > new Date(previous.submitted_at || 0)) {
                  latestByReviewer.set(login, review);
                }
              }
              const approvals = [...latestByReviewer.entries()].filter(([login, review]) =>
                review.state === "APPROVED" &&
                review.commit_id === headSha &&
                !excluded.has(login)
              );
              const staleOrSelf = [...latestByReviewer.entries()].filter(([login, review]) =>
                review.state === "APPROVED" &&
                (review.commit_id !== headSha || excluded.has(login))
              );
              if (approvals.length < approvalThreshold) {
                failures.push(`Need ${approvalThreshold} distinct independent approval(s) on exact HEAD; found ${approvals.length}.`);
              } else {
                notes.push(`Independent exact-HEAD approvals: ${approvals.map(([login]) => login).join(", ")}.`);
              }
              if (staleOrSelf.length) {
                notes.push(`Excluded stale/self approvals: ${staleOrSelf.map(([login]) => login).join(", ")}.`);
              }
              const changeRequests = [...latestByReviewer.entries()].filter(([, review]) => review.state === "CHANGES_REQUESTED");
              if (changeRequests.length) failures.push(`Unresolved latest change requests from: ${changeRequests.map(([login]) => login).join(", ")}.`);

              const threadQuery = `query($owner: String!, $repo: String!, $number: Int!) { repository(owner: $owner, name: $repo) { pullRequest(number: $number) { reviewThreads(first: 100) { nodes { isResolved } } } } }`;
              const threadData = await github.graphql(threadQuery, { owner, repo, number: prNumber });
              const unresolvedThreads = threadData.repository.pullRequest.reviewThreads.nodes.filter(t => !t.isResolved).length;
              if (unresolvedThreads) failures.push(`${unresolvedThreads} unresolved inline review thread(s) remain.`);

              for (const note of notes) core.notice(note);
              if (failures.length) {
                for (const failure of failures) core.error(failure);
                core.setFailed(`Independent review gate failed for PR #${prNumber} at ${headSha}.`);
              } else {
                core.info(`Independent review gate passed for PR #${prNumber} at ${headSha}.`);
              }
            }
