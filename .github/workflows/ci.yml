name: CI # Triggered on the Windows self-hosted runner

concurrency:
  group: global-citizen-ai-network-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Verify Windows runner toolchain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node --version
          npm --version
      - name: Migration filename safety guard
        run: node scripts/check-migration-versions.mjs
      - name: Install dependencies
        run: npm ci
      - name: Schema safety guard
        run: node scripts/check-schema.mjs
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (including development tooling)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: AI provider response and queue tests
        run: npm run test:unit
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build

  database:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Install pinned Supabase CLI without symlink-dependent setup actions
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $version = "3.2.0"
          $archive = Join-Path $env:RUNNER_TEMP "supabase-cli-$version.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "supabase-cli-$version"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/supabase/cli/releases/download/v$version/supabase_$($version)_windows_amd64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $cli = Get-ChildItem -LiteralPath $installDir -Filter "supabase.exe" -Recurse | Select-Object -First 1
          if (-not $cli) { throw "Supabase CLI executable was not found in the pinned release archive." }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $cli.DirectoryName
          & $cli.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Supabase CLI installation verification failed." }
      - name: Verify Docker Desktop is ready
        shell: powershell
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop is not available to the self-hosted runner." }
      - name: Initialize local Supabase config when absent
        shell: powershell
        run: |
          if (-not (Test-Path "supabase/config.toml")) {
            supabase init
            if ($LASTEXITCODE -ne 0) { throw "Supabase CLI initialization failed." }
          }
      - name: Start local Supabase services and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Run PostgreSQL and RLS tests
        run: supabase test db
      - name: Stop Supabase services
        if: always()
        run: supabase stop --no-backup

  auto-merge:
    name: Mark ready and merge after all CI checks pass
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner && startsWith(github.event.pull_request.head.ref, 'codex/')) ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'codex/'))
    needs: [build, database]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Convert verified Draft PR to Ready and merge
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let pr = context.payload.pull_request;
            if (!pr) {
              const branch = context.ref.replace('refs/heads/', '');
              const { data: matches } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: owner + ':' + branch, per_page: 20
              });
              pr = matches.find((candidate) => candidate.head.ref === branch);
            }
            const testedSha = context.payload.pull_request?.head?.sha || context.sha;
            if (pr && pr.head.sha !== testedSha) {
              core.notice('A newer PR head exists than the commit tested by this CI run; refusing to merge an untested commit.');
              return;
            }
            if (!pr || pr.user.login !== owner || !pr.head.ref.startsWith('codex/')) {
              core.notice('No owner-authored codex PR is associated with this successful CI run.');
              return;
            }
            if (pr.draft) {
              await github.graphql(
                'mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }',
                { id: pr.node_id }
              );
            }
            const { data } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: pr.head.sha
            });
            if (!data.merged) {
              core.setFailed('CI passed but GitHub did not confirm the PR merge.');
              return;
            }
            core.info('CI passed; Draft PR was marked ready and merged: ' + data.sha);
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'ai-task-next',
              client_payload: {
                source_pull_request: pr.number,
                outcome: 'ci_verified_merge'
              }
            });
            core.info('Triggered the persistent local AI task queue after the verified merge.');
