name: CI

# Serialize work on the single Windows Runner without dropping older pending CI runs.
# GitHub keeps up to 100 pending runs in this group and processes them FIFO.
concurrency:
  group: global-citizen-ai-network-self-hosted-runner
  queue: max
  cancel-in-progress: false

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  repository_dispatch:
    types: [ai-task-ci]

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}

jobs:
  build:
    name: Build, unit tests, type check, lint and production build
    outputs:
      failure_scope: ${{ steps.classify-failure.outputs.scope }}
    if: >-
      (github.event_name == 'push' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.user.login == github.repository_owner ||
        (startsWith(github.event.pull_request.head.ref, 'ai-task/issue-') &&
         contains(github.event.pull_request.body, '<!-- ai-task:')))) ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'ai-task-ci' &&
       github.event.client_payload.pull_request_number != '' &&
       github.event.client_payload.head_sha != '')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Verify local runner toolchain
        run: |
          node --version
          npm --version
      - name: Migration filename safety guard
        id: migration-guard
        run: node scripts/check-migration-versions.mjs
      - name: Install dependencies
        run: npm ci
      - name: Schema safety guard
        id: schema-guard
        run: node scripts/check-schema.mjs
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (including development tooling)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Unit tests
        id: unit-tests
        run: npm run test:unit
      - name: Type check
        id: type-check
        run: npx --no-install tsc --noEmit
      - name: Lint
        id: lint
        run: npm run lint
      - name: Build production app
        id: production-build
        run: npm run build
      - name: Classify build failure scope
        id: classify-failure
        if: failure()
        env:
          MIGRATION_GUARD: ${{ steps.migration-guard.outcome }}
          SCHEMA_GUARD: ${{ steps.schema-guard.outcome }}
          UNIT_TESTS: ${{ steps.unit-tests.outcome }}
          TYPE_CHECK: ${{ steps.type-check.outcome }}
          LINT: ${{ steps.lint.outcome }}
          PRODUCTION_BUILD: ${{ steps.production-build.outcome }}
        run: |
          $taskOutcomes = @($env:MIGRATION_GUARD, $env:SCHEMA_GUARD, $env:UNIT_TESTS, $env:TYPE_CHECK, $env:LINT, $env:PRODUCTION_BUILD)
          if ($taskOutcomes -contains "failure") {
            "scope=task" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Build failure is attributable to task validation."
          } else {
            "scope=system" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Build failure occurred before task validation; classify as system/runner failure."
          }

  database:
    name: Local Supabase migrations, PostgreSQL and RLS tests
    outputs:
      failure_scope: ${{ steps.classify-failure.outputs.scope }}
    if: >-
      (github.event_name == 'push' && github.actor == github.repository_owner) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (github.event.pull_request.user.login == github.repository_owner ||
        (startsWith(github.event.pull_request.head.ref, 'ai-task/issue-') &&
         contains(github.event.pull_request.body, '<!-- ai-task:')))) ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'ai-task-ci' &&
       github.event.client_payload.pull_request_number != '' &&
       github.event.client_payload.head_sha != '')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Install verified Supabase CLI without symlink privileges
        run: |
          $version = "3.2.0"
          $expectedSha256 = "1ca731039b1537ee4cceb9ea757ebcccee109f5eddc39228001a853c1fbe8122"
          $cacheRoot = Join-Path $env:RUNNER_TOOL_CACHE "supabase-cli/$version/x64"
          $exe = Join-Path $cacheRoot "supabase.exe"
          if (-not (Test-Path $exe)) {
            $archive = Join-Path $env:RUNNER_TEMP "supabase-$version-windows-amd64.zip"
            $extract = Join-Path $env:RUNNER_TEMP "supabase-$version-extract"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/supabase/cli/releases/download/v$version/supabase_$($version)_windows_amd64.zip" -OutFile $archive
            $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "Supabase CLI archive SHA-256 verification failed." }
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
            $candidate = Get-ChildItem -LiteralPath $extract -Filter "supabase.exe" -Recurse | Select-Object -First 1
            if (-not $candidate) { throw "Verified Supabase CLI executable was not found in the release archive." }
            New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
            Copy-Item -LiteralPath $candidate.FullName -Destination $exe -Force
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $cacheRoot
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "Supabase CLI version verification failed." }
      - name: Initialize local Supabase config when absent
        run: |
          if (-not (Test-Path "supabase/config.toml")) {
            supabase init
            if ($LASTEXITCODE -ne 0) { throw "Supabase CLI initialization failed." }
          }
      - name: Allocate isolated Supabase project and free local ports
        run: |
          $configPath = "supabase/config.toml"
          if (-not (Test-Path $configPath)) { throw "Supabase config is missing after initialization." }
          $config = Get-Content -LiteralPath $configPath -Raw
          $projectId = "gcan-ci-" + $env:GITHUB_RUN_ID
          $config = [regex]::Replace($config, '(?m)^project_id\s*=\s*"[^"]*"', "project_id = `"$projectId`"", 1)
          if ($config -notmatch '(?m)^project_id\s*=') { throw "Supabase project_id setting was not found." }

          function Set-TomlSectionValue([string]$Text, [string]$Section, [string]$Key, [int]$Value) {
            $pattern = "(?ms)(^\[" + [regex]::Escape($Section) + "\]\s*\r?\n)(.*?)(?=^\[|\z)"
            $match = [regex]::Match($Text, $pattern)
            if (-not $match.Success) { throw "Supabase config section [$Section] was not found." }
            $body = $match.Groups[2].Value
            $keyPattern = "(?m)^" + [regex]::Escape($Key) + "\s*=\s*\d+\s*$"
            if (-not [regex]::IsMatch($body, $keyPattern)) { throw "Supabase config key [$Section].$Key was not found." }
            $body = [regex]::Replace($body, $keyPattern, "$Key = $Value", 1)
            return $Text.Substring(0, $match.Index) + $match.Groups[1].Value + $body + $Text.Substring($match.Index + $match.Length)
          }

          function Test-PortAvailable([int]$Port) {
            $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, $Port)
            try { $listener.Start(); return $true }
            catch { return $false }
            finally { $listener.Stop() }
          }

          $basePort = 0
          for ($attempt = 0; $attempt -lt 500; $attempt++) {
            $candidate = 55000 + (([int64]$env:GITHUB_RUN_ID + ($attempt * 7)) % 9000)
            $available = $true
            foreach ($port in @([int]$candidate, [int]($candidate + 1), [int]($candidate + 2))) {
              if (-not (Test-PortAvailable $port)) { $available = $false; break }
            }
            if ($available) { $basePort = [int]$candidate; break }
          }
          if ($basePort -eq 0) { throw "Unable to allocate three consecutive local Supabase ports." }

          $config = Set-TomlSectionValue $config "api" "port" $basePort
          $config = Set-TomlSectionValue $config "db" "port" ($basePort + 1)
          $config = Set-TomlSectionValue $config "db" "shadow_port" ($basePort + 2)
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $configPath), $config, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Isolated Supabase project: $projectId"
          Write-Host "Allocated API/DB/shadow ports: $basePort / $($basePort + 1) / $($basePort + 2)"
      - name: Start local Supabase services and apply migrations
        id: supabase-start
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
          if ($LASTEXITCODE -ne 0) { throw "Local Supabase services failed to start or migrations failed." }
      - name: Run PostgreSQL and RLS tests
        id: database-tests
        run: |
          supabase test db
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL or RLS tests failed." }
      - name: Stop Supabase services
        if: always() && steps.supabase-start.outcome != 'skipped'
        continue-on-error: true
        run: supabase stop --no-backup
      - name: Classify database failure scope
        id: classify-failure
        if: failure()
        env:
          DATABASE_TESTS: ${{ steps.database-tests.outcome }}
        run: |
          if ($env:DATABASE_TESTS -eq "failure") {
            "scope=task" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Database/RLS assertion failure is attributable to the task."
          } else {
            "scope=system" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Supabase startup, migration application, or runner failure is system-scoped."
          }


  auto-merge-ai-task:
    name: Auto-merge validated AI task PR
    needs: [build, database]
    if: >-
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'ai-task/issue-') &&
          contains(github.event.pull_request.body, '<!-- ai-task:')
        ) ||
        (
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'ai-task-ci' &&
          github.event.client_payload.pull_request_number != '' &&
          github.event.client_payload.head_sha != ''
        )
      ) &&
      needs.build.result == 'success' &&
      needs.database.result == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Convert validated AI draft to ready and squash merge
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.eventName === "repository_dispatch"
              ? Number(context.payload.client_payload.pull_request_number)
              : context.payload.pull_request.number;
            const expectedHeadSha = context.eventName === "repository_dispatch"
              ? context.payload.client_payload.head_sha
              : context.payload.pull_request.head.sha;
            if (!Number.isInteger(pullNumber) || pullNumber < 1 || !expectedHeadSha) {
              core.setFailed("Missing validated AI task PR identity or tested head SHA.");
              return;
            }
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });

            const marker = /<!-- ai-task:(\d+) -->/.exec(pull.body || "");
            if (!marker ||
                !pull.head.ref.startsWith("ai-task/issue-") ||
                pull.head.repo?.full_name !== context.payload.repository.full_name ||
                pull.base.ref !== context.payload.repository.default_branch ||
                pull.head.sha !== expectedHeadSha) {
              core.setFailed("PR is not a verified same-repository AI task PR.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              per_page: 100
            });

            const destructivePatterns = [
              /\bDROP\s+TABLE\b/i,
              /\bDROP\s+SCHEMA\b/i,
              /\bTRUNCATE(?:\s+TABLE)?\b/i,
              /\bALTER\s+TABLE\b[\s\S]{0,500}?\bDROP\s+COLUMN\b/i
            ];
            const blockers = [];
            for (const file of files) {
              const isSql = /\.sql$/i.test(file.filename) ||
                file.filename.startsWith("supabase/migrations/");
              if (!isSql) continue;
              if (file.status === "removed") {
                blockers.push(file.filename + " (SQL/migration file deleted)");
                continue;
              }
              let source = file.patch || "";
              if (!file.patch || file.patch.length > 20000) {
                try {
                  const { data } = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: file.filename,
                    ref: pull.head.sha
                  });
                  if (!Array.isArray(data) && data.encoding === "base64") {
                    source = Buffer.from(data.content, "base64").toString("utf8");
                  }
                } catch (error) {
                  blockers.push(file.filename + " (unable to inspect SQL safely)");
                  continue;
                }
              }
              if (destructivePatterns.some((pattern) => pattern.test(source))) {
                blockers.push(file.filename + " (destructive database operation)");
              }
            }

            if (blockers.length) {
              core.warning("Automatic merge blocked; human review required: " + blockers.join(", "));
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body: "Automatic merge was blocked because this PR deletes a SQL/migration file or contains a destructive database operation. Human review is required before merging.\n\n" + blockers.map((item) => "- " + item).join("\n")
              });
              return;
            }

            const { data: latest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber
            });
            if (latest.head.sha !== expectedHeadSha || latest.state !== "open") {
              core.setFailed("PR changed or closed during the merge safety check; refusing to merge.");
              return;
            }

            if (latest.draft) {
              await github.graphql(
                "mutation($pullRequestId: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $pullRequestId}) { pullRequest { isDraft } } }",
                { pullRequestId: latest.node_id }
              );
            }

            const merged = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              merge_method: "squash",
              sha: pull.head.sha
            });
            if (!merged.data.merged) {
              core.setFailed("GitHub did not confirm the squash merge.");
              return;
            }
            core.notice("AI task PR #" + pullNumber + " passed build and database CI and was squash-merged.");
            try {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: Number(marker[1]),
                state: "closed"
              });
            } catch (error) {
              core.warning("PR merged, but source task Issue could not be closed: " + error.message);
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "ai-task-next",
              client_payload: {
                source_issue: Number(marker[1]),
                source_pull_request: pullNumber,
                outcome: "ai_task_merged"
              }
            });
            core.notice("Dispatched the next AI task only after successful squash merge.");

  circuit-breaker:
    name: Persist CI failures in the factory circuit breaker
    if: always() && (needs.build.result == 'failure' || needs.database.result == 'failure')
    needs: [build, database]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Record one failure for this CI run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_FACTORY_MODE: failure
          AGENT_FACTORY_FAILURE_SCOPE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'ai-task/issue-') && contains(github.event.pull_request.body, '<!-- ai-task:') && (needs.build.result != 'failure' || needs.build.outputs.failure_scope == 'task') && (needs.database.result != 'failure' || needs.database.outputs.failure_scope == 'task') && (needs.build.outputs.failure_scope == 'task' || needs.database.outputs.failure_scope == 'task') && 'task' || 'system' }}
          FAILED_ISSUE_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'ai-task/issue-') && contains(github.event.pull_request.body, '<!-- ai-task:') && github.event.pull_request.body || '' }}
          FAILURE_SUMMARY: "CI run ${{ github.run_id }} failed for ref ${{ github.ref }}. Inspect build/database job logs."
        run: node scripts/agent-factory-controller.mjs
