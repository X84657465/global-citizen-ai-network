name: CI

concurrency:
  group: global-citizen-ai-network-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Verify Windows runner toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          docker version
      - name: Migration filename safety guard
        run: node scripts/check-migration-versions.mjs
      - name: Install dependencies
        run: npm ci
      - name: Schema safety guard
        run: node scripts/check-schema.mjs
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (including development tooling)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: AI provider response and queue tests
        run: npm run test:unit
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build

  database:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Verify Docker Desktop is ready
        shell: pwsh
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop is not available to the self-hosted runner." }
      - name: Initialize local Supabase config
        run: supabase init
      - name: Start local Supabase services and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Run PostgreSQL and RLS tests
        run: supabase test db
      - name: Stop Supabase services
        if: always()
        run: supabase stop --no-backup

  auto-merge:
    name: Mark ready and merge after all CI checks pass
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == github.repository_owner &&
      startsWith(github.event.pull_request.head.ref, 'codex/')
    needs: [build, database]
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Convert verified Draft PR to Ready and merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if (pr.user.login !== owner || !pr.head.ref.startsWith('codex/')) {
              core.notice('PR is outside the authorized auto-merge scope.');
              return;
            }
            if (pr.draft) {
              await github.graphql(
                'mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }',
                { id: pr.node_id }
              );
            }
            const { data } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              merge_method: 'squash',
              sha: pr.head.sha
            });
            if (!data.merged) {
              core.setFailed('CI passed but GitHub did not confirm the PR merge.');
              return;
            }
            core.info('CI passed; Draft PR was marked ready and merged: ' + data.sha);
