name: CI

concurrency:
  group: global-citizen-ai-network-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Migration filename safety guard
        run: node scripts/check-migration-versions.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
      - name: Install dependencies
        run: npm ci
      - name: Schema safety guard
        run: node scripts/check-schema.mjs
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (including development tooling)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: AI provider response tests
        run: npm run test:unit
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build production app
        run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Initialize local Supabase config
        run: supabase init
      - name: Start local Supabase services and apply migrations
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Run PostgreSQL and RLS tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
